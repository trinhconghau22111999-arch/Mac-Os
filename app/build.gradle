plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// Phiên bản GeckoView cố định: đọc từ file gecko.version ở thư mục gốc (CI tự ghi lại ở lần build đầu tiên thành công).
// Chưa có file (hoặc nội dung sai dạng) thì tạm dùng 128.+ như cũ. Muốn nâng cấp Gecko: sửa nội dung file này.
def geckoVer = rootProject.file('gecko.version').exists() ? rootProject.file('gecko.version').text.trim() : ''
if (!(geckoVer ==~ /^128\.[0-9A-Za-z.\-]+$/)) geckoVer = '128.+'
dependencies {
    implementation 'androidx.core:core:1.13.1'
    // ---- Trình duyệt Gecko (Firefox) đóng gói sẵn; thư viện gốc được lọc theo abiFilters bên dưới ----
    implementation "org.mozilla.geckoview:geckoview-omni:${geckoVer}"
    // ---- App con "Duyệt web" (chép từ repo Webandr) ----
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
android {
    namespace 'com.desktopmini.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.desktopmini.launcher'
        minSdk 24
        targetSdk 34
        // Mỗi lần build trên GitHub Actions số phiên bản tự tăng (run_number) để cài đè được bản cũ
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode run
        versionName "1.0.${run}"
        // Bản này chỉ dành cho máy Lenovo Yoga Book YB1-X90F (chip Intel, Android 32-bit): chỉ đóng gói x86 nên APK nhẹ hơn nhiều, nhưng KHÔNG cài được trên điện thoại ARM.
        // Muốn đóng cho máy khác: -Pabis=arm64-v8a (hoặc nhập ở nút Run workflow), ví dụ 'arm64-v8a,x86_64,x86' cho cả ba loại CPU
        def abis = ((project.findProperty('abis') ?: 'x86') as String).split(',').collect { it.trim() }.findAll { it }
        ndk { abiFilters.addAll(abis) }
    }
    signingConfigs {
        release {
            // Chữ ký cố định lấy từ GitHub Secrets; build máy khác không có thì dùng chữ ký debug
            def ksPath = System.getenv('KEYSTORE_PATH')
            if (ksPath && new File(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false; checkReleaseBuilds false }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
    }
}
