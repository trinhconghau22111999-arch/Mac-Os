plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    // ---- App con "Ổ mềm" (Bo-nho-ao) ----
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation('com.google.api-client:google-api-client-android:2.2.0') { exclude group: 'org.apache.httpcomponents' }
    implementation('com.google.apis:google-api-services-drive:v3-rev20220815-2.0.0') { exclude group: 'org.apache.httpcomponents' }
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
    // ---- Trình duyệt Gecko (Firefox) đóng gói sẵn, chỉ bản x86_64 (chép từ repo dang-nhap-github) ----
    implementation 'org.mozilla.geckoview:geckoview-x86_64:128.+'
}
android {
    namespace 'com.desktopmini.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.desktopmini.launcher'
        minSdk 24
        targetSdk 34
        ndk { abiFilters 'x86_64' }
        // Mỗi lần build trên GitHub Actions số phiên bản tự tăng (run_number) để cài đè được bản cũ
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode run
        versionName "1.0.${run}"
    }
    signingConfigs {
        release {
            // Chữ ký cố định lấy từ GitHub Secrets; build máy khác không có thì dùng chữ ký debug
            def ksPath = System.getenv('KEYSTORE_PATH')
            if (ksPath && new File(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false; checkReleaseBuilds false }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
    }
}
