<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}html,body{margin:0}</style>
<title>Desktop Mini</title>
<style>
/* Layout: một màn hình bo góc. Menu bar trong suốt, dock kính nổi dưới đáy, cửa sổ bo lớn có đèn giao thông, các lớp phủ (Launchpad, Mission Control, khóa) phủ lên trên. */
:root{
  --bg:#e7e8ec; --fg:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.1);
  --win:#ffffff; --side:rgba(238,238,243,.68); --hdr:rgba(255,255,255,.72);
  --glass:rgba(250,250,253,.66); --glass-line:rgba(255,255,255,.7); --menu-hi:#0a7aff;
  --accent:#0a7aff; --row:rgba(0,0,0,.035); --field:rgba(120,120,128,.14); --sel:rgba(120,120,128,.24);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131418; --fg:#f4f4f7; --muted:#a0a0a9; --line:rgba(255,255,255,.12);
    --win:#1f2024; --side:rgba(52,53,60,.62); --hdr:rgba(40,41,46,.72);
    --glass:rgba(44,45,52,.62); --glass-line:rgba(255,255,255,.16);
    --accent:#3d95ff; --row:rgba(255,255,255,.045); --field:rgba(120,120,128,.26); --sel:rgba(120,120,128,.34);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131418; --fg:#f4f4f7; --muted:#a0a0a9; --line:rgba(255,255,255,.12);
  --win:#1f2024; --side:rgba(52,53,60,.62); --hdr:rgba(40,41,46,.72);
  --glass:rgba(44,45,52,.62); --glass-line:rgba(255,255,255,.16);
  --accent:#3d95ff; --row:rgba(255,255,255,.045); --field:rgba(120,120,128,.26); --sel:rgba(120,120,128,.34);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;padding-inline:16px;padding-block:16px;background:var(--bg);color:var(--fg);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default;text-align:inherit}
input,textarea{font:inherit;color:inherit}
/* Ô nhập luôn gõ được (stage đang tắt user-select nên WebView Android chặn bàn phím) */
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul,ol{margin:0;padding:0;list-style:none}
.grow{flex:1}
.none{padding:26px 16px;text-align:center;color:var(--muted)}
.lnk{color:var(--accent)}
.lnk:hover{text-decoration:underline}

.stage{--base:54px;position:relative;height:100%;min-height:560px;border-radius:16px;overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none;
  background:radial-gradient(70% 55% at 18% -5%,#9be8ff 0,transparent 60%),radial-gradient(60% 60% at 92% 18%,#8aa8ff 0,transparent 62%),radial-gradient(90% 70% at 55% 112%,#2342d8 0,transparent 70%),#2f6fe0}
.stage[data-wall="2"]{background:radial-gradient(65% 55% at 15% 8%,#ffb48a 0,transparent 62%),radial-gradient(60% 60% at 92% 30%,#d55bd8 0,transparent 62%),radial-gradient(90% 70% at 50% 115%,#3a2a9a 0,transparent 70%),#7b3fb0}
.stage[data-wall="3"]{background:radial-gradient(60% 50% at 20% 5%,#3d5a9e 0,transparent 62%),radial-gradient(55% 60% at 90% 25%,#6a45d6 0,transparent 62%),radial-gradient(90% 70% at 50% 115%,#1a2250 0,transparent 70%),#0b1026}
.dim{position:absolute;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none}

/* Màn hình nền */
.desk{position:absolute;inset:0;z-index:0;padding:40px 12px 110px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-end;gap:6px}
.desk.dropping{background:rgba(255,255,255,.1)}
.di{width:88px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:10px;color:#fff;text-align:center}
.di .dl{max-width:100%;padding:1px 6px;border-radius:5px;font-size:12px;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.6);word-break:break-word}
.di[aria-selected="true"]{background:rgba(255,255,255,.2)}
.di[aria-selected="true"] .dl{background:var(--accent);text-shadow:none}
.di .rn{width:100%;border:0;border-radius:4px;padding:1px 4px;font-size:12px;text-align:center;background:#fff;color:#1d1d1f}
.mcbg{position:absolute;inset:0;z-index:1;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s}
.stage.mc .mcbg{background:rgba(0,0,0,.42);pointer-events:auto}
.mcsp{position:absolute;top:36px;left:50%;transform:translateX(-50%);padding:5px 16px;border-radius:10px;background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.mcnone{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px}
.mcl{position:absolute;z-index:1;color:#fff;text-align:center;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}

/* Thanh menu */
.menubar{position:absolute;inset:0 0 auto 0;height:28px;z-index:6;display:flex;align-items:center;gap:2px;padding-inline:8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);font-size:13px;white-space:nowrap;background:linear-gradient(rgba(0,0,0,.16),transparent)}
.mb,.sb{height:22px;padding-inline:9px;border-radius:6px;display:flex;align-items:center;gap:6px}
.mb:hover,.mb.open,.sb:hover,.sb.open{background:rgba(255,255,255,.22)}
.mb.logo{padding-inline:8px}
.sb{padding-inline:7px}
.mb svg,.sb svg{width:16px;height:16px;fill:currentColor;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.appname{font-weight:700}
.sb.off svg{opacity:.45}
.clk{font-variant-numeric:tabular-nums;gap:7px;padding-inline:8px}
@media (max-width:560px){.opt{display:none}}

.pop{position:absolute;top:30px;z-index:7;min-width:230px;padding:6px;border-radius:12px;background:var(--glass);color:var(--fg);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);
  box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 0 0 1px var(--glass-line) inset,0 16px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;text-shadow:none;font-size:13px}
#ctx{z-index:8}
.mn{text-align:left;padding:4px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:24px}
.mn:hover:not(:disabled),.mn:focus-visible{background:var(--menu-hi);color:#fff;outline:0}
.mn:disabled{opacity:.4}
.kh{opacity:.6;font-size:12px}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 4px;width:calc(100% - 8px)}

/* Trung tâm điều khiển */
.cc{position:absolute;top:32px;right:8px;z-index:7;width:min(300px,calc(100% - 16px));padding:12px;border-radius:24px;background:var(--glass);color:var(--fg);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);
  box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 0 0 1px var(--glass-line) inset,0 16px 40px rgba(0,0,0,.3);display:grid;grid-template-columns:1fr 1fr;gap:10px;text-shadow:none}
.tile{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--field);text-align:left;min-width:0}
.tile .ci{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(120,120,128,.4);color:#fff;flex:none}
.tile .ci svg{width:17px;height:17px;fill:currentColor}
.tile[aria-pressed="true"] .ci{background:var(--accent)}
.tile b{display:block;font-weight:600;line-height:1.2}
.tile small{color:var(--muted);font-size:11.5px}
.slide{grid-column:1/-1;padding:10px 12px;border-radius:16px;background:var(--field)}
.slide b{display:block;font-weight:600;margin-bottom:6px}
.slide input{width:100%;accent-color:var(--accent);margin:0}
.npr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.npr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.npb{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.npb svg{width:14px;height:14px;fill:currentColor}

/* Thông báo */
.nc{position:absolute;top:30px;right:8px;bottom:8px;z-index:7;width:min(340px,calc(100% - 16px));overflow:auto;padding:14px;border-radius:24px;background:var(--glass);color:var(--fg);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);
  box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 0 0 1px var(--glass-line) inset,0 16px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;text-shadow:none}
.nch{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.nlist{display:flex;flex-direction:column;gap:8px}
.nit,.bn{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:16px;background:var(--field);text-align:left;width:100%}
.nit .ic,.bn .ic{width:34px;height:34px;flex:none}
.nit span,.bn span{display:flex;flex-direction:column;min-width:0}
.nit small,.bn small{color:var(--muted);font-size:11.5px}
.nit em,.bn em{font-style:normal;color:var(--fg);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wg{background:var(--field);border-radius:18px;padding:12px;min-width:0}
.wg:first-child{grid-column:1/-1}
.wg small{color:var(--accent);font-weight:700;font-size:11px;letter-spacing:.04em}
.wg>b{display:block;font-size:17px;margin:2px 0 6px}
.wg ul{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.wg li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg p{margin:6px 0 0;color:var(--muted)}
.mc7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums}
.mc7 span{color:var(--muted)}
.mc7 i{font-style:normal;padding:2px 0}
.mc7 i.td{background:#ff3b30;color:#fff;border-radius:50%;font-weight:700}
.banners{position:absolute;top:34px;right:10px;z-index:9;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 20px));pointer-events:none}
.bn{pointer-events:auto;background:var(--glass);color:var(--fg);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 0 0 1px var(--glass-line) inset,0 12px 30px rgba(0,0,0,.3);border-radius:20px;animation:bnin .38s cubic-bezier(.2,.9,.3,1)}
.bn.out{opacity:0;transform:translateX(40px);transition:opacity .3s,transform .3s}
@keyframes bnin{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}

/* Spotlight */
.spot{position:absolute;z-index:8;left:50%;top:16%;transform:translateX(-50%);width:min(580px,calc(100% - 24px));border-radius:26px;background:var(--glass);color:var(--fg);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);
  box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 0 0 1px var(--glass-line) inset,0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.sin{display:flex;align-items:center;gap:12px;padding:14px 18px}
.sin svg{width:22px;height:22px;fill:var(--muted);flex:none}
.sin input{flex:1;min-width:0;background:none;border:0;font-size:22px;font-weight:300;outline:0}
.sres{border-top:1px solid var(--line);padding:6px;display:flex;flex-direction:column}
.sres:empty{display:none}
.sr{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:10px;text-align:left;width:100%}
.sr[aria-selected="true"],.sr:hover:not(.nores){background:var(--accent);color:#fff}
.sr .ic{width:34px;height:34px;border-radius:8px;flex:none}
.sr small{margin-left:auto;opacity:.7;white-space:nowrap}
.nores{color:var(--muted);justify-content:center}

/* Launchpad */
.lp{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;padding:56px 24px 28px;background:rgba(10,14,30,.42);backdrop-filter:blur(46px) saturate(1.5);-webkit-backdrop-filter:blur(46px) saturate(1.5);animation:lpin .28s ease-out}
.lp.out{opacity:0;transform:scale(1.06);transition:opacity .2s,transform .2s}
@keyframes lpin{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
.lpq{display:flex;align-items:center;gap:8px;width:min(260px,100%);height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff}
.lpq svg{width:14px;height:14px;flex:none}
.lpq input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff}
.lpq input::placeholder{color:rgba(255,255,255,.7)}
.lpg{flex:1;width:min(860px,100%);display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));align-content:start;justify-items:center;gap:26px 10px;overflow:auto;min-height:0;padding:24px 0 36px;-webkit-overflow-scrolling:touch}
.lpi{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);font-size:12.5px;padding:6px;border-radius:14px}
.lpi .ic{width:64px;height:64px}
.lpd{display:flex;gap:8px;height:10px}
.lpd i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.lpd i.on{background:#fff}

/* Chuyển ứng dụng, Xem nhanh */
.sw{position:absolute;z-index:13;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:10px;padding:14px;border-radius:26px;background:var(--glass);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);box-shadow:0 0 0 1px var(--glass-line) inset,0 20px 50px rgba(0,0,0,.4);max-width:calc(100% - 20px);overflow:auto}
.swi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:16px;color:var(--fg);font-size:12px;min-width:76px}
.swi .ic{width:56px;height:56px}
.swi[aria-current="true"]{background:var(--sel)}
.ql{position:absolute;inset:0;z-index:14;display:grid;place-items:center;background:rgba(0,0,0,.28)}
.qlp{width:min(340px,calc(100% - 32px));padding:28px 20px 20px;border-radius:24px;background:var(--glass);color:var(--fg);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);box-shadow:0 0 0 1px var(--glass-line) inset,0 24px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qli{--u:20px;margin-bottom:10px;height:calc(var(--u)*5);display:grid;place-items:center}
.qlp b{font-size:15px;word-break:break-word}
.qlp span,.qlp small{color:var(--muted)}
.qlp em{font-style:normal;font-size:11.5px;color:var(--muted);margin-top:10px}

/* Màn hình khóa và nguồn */
.lock{position:absolute;inset:0;z-index:40;color:#fff;display:flex;flex-direction:column;align-items:center;padding:7% 20px 22px;background:rgba(10,14,34,.5);backdrop-filter:blur(48px) saturate(1.4);-webkit-backdrop-filter:blur(40px) saturate(1.4);text-shadow:0 1px 6px rgba(0,0,0,.25)}
.lock.out{opacity:0;transform:translateY(-36px) scale(1.04);transition:opacity .4s,transform .4s}
.lt{font-size:min(96px,20vw);font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.ld{font-size:19px;margin-top:6px;opacity:.9}
.lu{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.lav{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#8fa8ff,#7a5cd6);display:grid;place-items:center;font-size:34px;font-weight:300;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.ln{font-size:17px;font-weight:600}
.lu form{display:flex;align-items:center;gap:6px;width:min(230px,80vw);height:34px;padding:0 4px 0 14px;border-radius:999px;background:rgba(255,255,255,.22);text-shadow:none}
.lu input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff}
.lu input::placeholder{color:rgba(255,255,255,.75)}
.go{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center}
.go svg{width:14px;height:14px}
.lh{font-size:11.5px;opacity:.7;text-align:center;max-width:260px}
.lpw{display:flex;gap:26px;margin-top:22px}
.pb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.pbi{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.pbi svg{width:18px;height:18px;fill:currentColor}
#off.off,div.off{position:absolute;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.off[data-mode="sleep"]{cursor:pointer}
.offs{color:rgba(255,255,255,.55);font-size:13px}
.pwr{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.pwr svg{width:26px;height:26px}
.blogo svg{width:64px;height:64px;fill:#fff}
.bbar2{width:190px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.bbar2 i{display:block;height:100%;width:0;background:#fff;transition:width 2.2s ease-in-out}

/* Cửa sổ */
.wins{position:absolute;inset:0;z-index:2;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;pointer-events:auto;box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.22)}
.win::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);pointer-events:none;z-index:9}
.win.focus{box-shadow:0 0 0 .5px rgba(0,0,0,.35),0 28px 70px rgba(0,0,0,.45)}
.win.min{display:none}
.win.max{border-radius:0}
.tb{position:absolute;inset:0 0 auto 0;height:52px;z-index:2;touch-action:none}
.tls{position:absolute;left:18px;top:19px;z-index:10;display:flex;gap:8px}
.tl{width:13px;height:13px;border-radius:50%;display:grid;place-items:center;font-size:10px;line-height:1;font-weight:800;color:rgba(0,0,0,.6);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.tl.c{background:#ff5f57}.tl.m{background:#febc2e}.tl.z{background:#28c840}
.tls:hover .tl{color:rgba(0,0,0,.55)}
.win:not(.focus) .tl{background:rgba(150,150,158,.6)}
.body{flex:1;min-height:0;position:relative;container-type:inline-size;overflow:hidden}
.rz{position:absolute;z-index:8;display:block}
.rz[data-d="r"]{top:52px;right:0;bottom:14px;width:6px;cursor:ew-resize}
.rz[data-d="l"]{top:52px;left:0;bottom:14px;width:6px;cursor:ew-resize}
.rz[data-d="b"]{left:14px;right:14px;bottom:0;height:6px;cursor:ns-resize}
.rz[data-d="br"]{right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
.stage.mc .win,.stage.mcx .win{transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.stage.mc .win{cursor:pointer}
.stage.mc .win *{pointer-events:none}
.win.dark-win{color:#f4f4f7}
.ghost{position:absolute;z-index:60;padding:4px 10px;border-radius:8px;background:var(--glass);color:var(--fg);box-shadow:0 0 0 1px var(--glass-line) inset,0 6px 18px rgba(0,0,0,.3);pointer-events:none;font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropping{outline:2px solid var(--accent);outline-offset:-2px}
.dk.dropping{outline:0}
.dk.dropping .ic{box-shadow:0 0 0 3px var(--accent)}

/* Thành phần chung */
.app{display:flex;flex-direction:column;height:100%;background:var(--win)}
.bar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding-inline:16px;touch-action:none}
.app>.bar{padding-left:78px;background:var(--hdr)}
.bar .t{font-weight:700;font-size:14px}
.cn{font-size:12px;color:var(--muted);font-weight:400}
.btn{padding:5px 14px;border-radius:999px;background:var(--field);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(.94)}
.btn.pri{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4}
.ib{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover:not(:disabled){background:var(--field)}
.ib:disabled{opacity:.35}
.ib svg,.nv svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"] svg{fill:#ff3b5c;stroke:#ff3b5c}
.nv{display:flex;border-radius:999px;background:var(--field);overflow:hidden;flex:none}
.nv button{min-width:32px;height:28px;display:grid;place-items:center;padding-inline:4px}
.nv button:disabled{opacity:.3}
.nv button[aria-pressed="true"]{background:var(--sel)}
.nv.nf{display:grid;place-items:center;width:32px;height:28px;padding:0}
.nv.nf:disabled{opacity:.3}
.tg{width:38px;height:22px;border-radius:11px;background:rgba(120,120,128,.4);position:relative;transition:background .15s;flex:none}
.tg i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.tg[aria-checked="true"]{background:#34c759}
.tg[aria-checked="true"] i{transform:translateX(16px)}
.side{background:var(--side);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);padding:56px 10px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side h4{margin:6px 10px 4px;font-size:11.5px;font-weight:600;color:var(--muted)}
.si{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;text-align:left;width:100%}
.si svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.si .sq{width:18px;height:18px;border-radius:5px;background:var(--c);flex:none}
.si[aria-current="true"]{background:var(--sel)}
.si .cnt{margin-left:auto;font-style:normal;color:var(--muted);font-size:12px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--win)}
.foot{padding:7px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;flex:none}
.empty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.empty svg{width:56px;height:56px;fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px;opacity:.7}
.rn{border:0;border-radius:4px;padding:1px 4px;background:var(--win);color:var(--fg);box-shadow:0 0 0 2px var(--accent);min-width:0}

/* Biểu tượng tệp */
.fic{--u:10px;display:block;position:relative;flex:none}
.fic.doc{width:calc(var(--u)*4);height:calc(var(--u)*5);background:#fff;border-radius:calc(var(--u)*.4);box-shadow:0 0 0 1px rgba(0,0,0,.18),0 2px 5px rgba(0,0,0,.18);overflow:hidden}
.fic.doc i{position:absolute;top:0;right:0;width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);background:linear-gradient(225deg,rgba(0,0,0,.14) 50%,#eee 50%)}
.fic.doc b{position:absolute;left:0;right:0;bottom:calc(var(--u)*.7);text-align:center;font-size:calc(var(--u)*.9);line-height:calc(var(--u)*1.5);color:#fff;background:var(--c);font-weight:800;letter-spacing:.03em}
.fic.folder,.fic.disk{width:calc(var(--u)*5);height:calc(var(--u)*4.2)}
.fic.folder svg,.fic.disk svg{width:100%;height:100%;display:block}
.row .fic{--u:5.4px;margin-inline:auto}
.cell .fic,.di .fic{--u:11px}

/* Tệp */
.fin{display:grid;grid-template-columns:200px minmax(0,1fr);height:100%}
.main>.bar{padding-inline:14px}
.sf{display:flex;align-items:center;gap:6px;height:28px;padding-inline:10px;border-radius:999px;background:var(--field);width:150px;min-width:0}
.sf svg{width:13px;height:13px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex:none}
.sf input{background:none;border:0;outline:0;min-width:0;width:100%}
.fl{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.fl:focus-visible{outline:0}
.chd,.row{display:grid;grid-template-columns:36px minmax(0,1fr) 150px 74px;align-items:center;gap:8px}
.chd{padding:5px 22px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;flex:none}
.chd span:first-child{grid-column:1/3}
.rows{padding:6px 10px;flex:1}
.row{width:100%;padding:3px 12px;border-radius:8px}
.rows .row:nth-child(even){background:var(--row)}
.row[aria-selected="true"]{background:var(--accent)!important;color:#fff}
.row[aria-selected="true"] .dt,.row[aria-selected="true"] .sz{color:rgba(255,255,255,.85)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt,.sz{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sz{text-align:right}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:14px;align-content:start;flex:1}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:10px;text-align:center;min-width:0}
.cell[aria-selected="true"]{background:var(--sel)}
.cell .nm{white-space:normal;word-break:break-word;font-size:12px;padding:1px 6px;border-radius:5px;max-width:100%}
.cell[aria-selected="true"] .nm{background:var(--accent);color:#fff}
@container (max-width:470px){
  .fin{grid-template-columns:128px minmax(0,1fr)}
  .chd,.row{grid-template-columns:36px minmax(0,1fr) 62px}
  .chd .dt,.row .dt{display:none}
  .sf{width:104px}
}

/* Lịch */
.cal{position:relative}
.cal-bar .t{font-size:20px;font-weight:300;white-space:nowrap}
.cal-bar .t b{font-weight:700}
.cnav{display:flex;border-radius:999px;background:var(--field);overflow:hidden}
.cnav button{height:28px;padding-inline:12px;display:grid;place-items:center}
.cnav button+button{border-left:1px solid var(--line)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.wk span{padding:4px 8px;text-align:right}
.cg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr))}
/* Lịch: tiêu đề tháng và nút ‹ Hôm nay › luôn hiện đủ, không bị khuất */
.cal>.bar{min-width:0;gap:6px;padding-right:12px}
.cal-bar .t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:clamp(14px,4.2vw,20px)}
.cal-bar .grow{display:none}
.cnav{flex:none}
.cnav button{padding-inline:10px}
.cal>.wk,.cal>.cg{min-width:0}
.cal>.cg{min-height:120px}

.cd{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;font-variant-numeric:tabular-nums;overflow:hidden;position:relative}
.cd:nth-child(7n+1){border-left:0}
.cd:nth-child(-n+7){border-top:0}
.cd:hover{background:var(--row)}
.cd.o{color:var(--muted);opacity:.6}
.cd i{font-style:normal;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding-inline:3px;flex:none}
.cd .lu{margin:-2px 0 2px!important;display:block;font-size:10px;color:var(--muted);line-height:1;font-variant-numeric:tabular-nums;flex:none}
.cd .lu.l1{color:#ff3b30;font-weight:600}
.evp .lud{display:block;margin:2px 0 6px;font-size:11px;color:var(--muted)}
.cd.today i{background:#ff3b30;color:#fff;font-weight:700}
.chip{align-self:stretch;font-size:11px;line-height:1.3;padding:1px 5px;border-radius:4px;background:rgba(10,122,255,.18);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.chip.more{background:none;color:var(--muted)}
.dotev{display:none;width:5px;height:5px;border-radius:50%;background:var(--accent)}
@container (max-width:520px){.chip{display:none}.dotev{display:block}}
.evp{position:absolute;z-index:6;width:240px;padding:12px;border-radius:16px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 0 0 1px var(--glass-line) inset,0 12px 30px rgba(0,0,0,.3)}
.evp ul{margin:8px 0;display:flex;flex-direction:column;gap:4px}
.evp li{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;border-radius:6px;background:rgba(10,122,255,.14)}
.evp li button{opacity:.6}
.evp form{display:flex;gap:6px}
.evp input{flex:1;min-width:0;border:0;border-radius:8px;padding:5px 8px;background:var(--field);outline:0}

/* Ghi chú */
.nts{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.nl{background:var(--side);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);display:flex;flex-direction:column;min-height:0}
.nl .bar{padding-left:78px}.nl .bar .t{white-space:nowrap}
.ned .sv{height:28px;padding:0 12px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;flex:none}
.ned .sv.ok{background:#28c840}
.nlst{overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
.nt{display:flex;flex-direction:column;gap:1px;padding:7px 10px;border-radius:9px;text-align:left}
.nt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt i{font-style:normal;color:var(--fg);opacity:.7}
.nt[aria-current="true"]{background:#ffd54a;color:#1d1d1f}
.nt[aria-current="true"] span{color:rgba(0,0,0,.65)}
.ned{display:flex;flex-direction:column;background:var(--win);min-width:0}
.ned .bar{padding-inline:14px}
.ned textarea{flex:1;min-height:0;resize:none;border:0;background:transparent;color:inherit;font:15px/1.65 var(--font);padding:4px 22px 18px;user-select:text;-webkit-user-select:text}
.ned textarea:focus-visible{outline:0}
@container (max-width:520px){.nts{grid-template-columns:150px minmax(0,1fr)}.nl .bar{padding-left:78px}}

/* Nhắc nhở */
.rem .rh{display:flex;justify-content:space-between;align-items:baseline;padding:4px 20px 8px}
.rc{font-size:30px;color:var(--accent)}
.rml{flex:1;overflow:auto;padding:0 12px}
.rml li{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--line)}
.rml li span{flex:1;min-width:0;word-break:break-word}
.rml li.done span{color:var(--muted);text-decoration:line-through}
.rml .none{display:block;border:0}
.ck{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted);flex:none;position:relative}
.rml li.done .ck{background:var(--accent);box-shadow:none}
.rml li.done .ck::after{content:"";position:absolute;left:6px;top:3px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.rx{opacity:.4;font-size:18px;padding-inline:4px}
.rx:hover{opacity:1}
.ra{padding:10px 14px;border-top:1px solid var(--line)}
.ra input{width:100%;border:0;border-radius:10px;padding:8px 12px;background:var(--field);outline:0}

/* Máy tính */
.calc{--bh:44px;position:relative;container-type:size;display:flex;flex-direction:column;height:100%;background:rgba(28,28,31,.97);padding:0 10px 10px;gap:8px}
.calc .bar{height:var(--bh);padding-inline:0;display:flex;align-items:center;justify-content:flex-end;flex:none}
.hbtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.hbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.expr{min-height:1.3em;padding:0 10px;text-align:right;font-size:clamp(15px,3.6cqh,28px);color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;margin-top:auto}
.disp{flex:0 0 auto;min-height:56px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 2px;font-size:46px;line-height:1.1;font-weight:300;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;color:#fff}
.disp span{display:block}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.k{height:46px;border-radius:23px;background:#505055;color:#fff;font-size:19px;display:grid;place-items:center}
.k:active{filter:brightness(1.4)}
.k.fn{background:#a5a5ab;color:#111}
.k.op{background:#ff9f0a}
.k.op.on{background:#fff;color:#ff9f0a}
.k.wide{grid-column:span 2;justify-content:start;padding-left:19px}
.chist{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;padding:var(--bh) 12px 12px;background:rgba(28,28,31,.99);color:#fff}
.chist[hidden]{display:none}
.chh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 8px;border-bottom:1px solid rgba(255,255,255,.14)}
.chh b{font-size:16px}
.chh span{display:flex;gap:8px}
.chh button{padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:13px}
.chl{flex:1;min-height:0;overflow:auto;margin:0;padding:0;list-style:none}
.chl li{padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right;cursor:pointer}
.chl li:active{background:rgba(255,255,255,.08)}
.chl small{display:block;color:rgba(255,255,255,.5);font-size:12px;font-variant-numeric:tabular-nums}
.chl em{display:block;font-style:normal;font-size:24px;font-weight:300;font-variant-numeric:tabular-nums;word-break:break-all}
.chl .non{text-align:center;color:rgba(255,255,255,.5);padding:30px 0;border:0;cursor:default}
/* Cửa sổ thấp (màn hình ngang): thu gọn để không bị Dock che */
@container (max-height:340px){
  .calc{--bh:36px;gap:4px;padding:0 8px 8px}
  .keys{flex:1;min-height:0;grid-template-rows:repeat(5,minmax(0,1fr));gap:4px}
  .k{height:auto;min-height:0;font-size:15px;border-radius:999px}
  .k.wide{padding-left:16px}
  .disp{min-height:0}
  .hbtn{width:28px;height:28px}
}
/* Vừa thấp vừa rộng: màn hình trái, phím phải */
@container (max-height:340px) and (min-width:440px){
  .calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:12px;row-gap:2px}
  .calc .bar{grid-column:1;grid-row:1}
  .expr{grid-column:1;grid-row:2;align-self:end;margin-top:0}
  .disp{grid-column:1;grid-row:3}
  .keys{grid-column:2;grid-row:1/4}
}


/* Báo thức */
.alm{display:flex;flex-direction:column;gap:12px;max-width:420px;margin:0 auto}
.whl{position:relative;isolation:isolate;display:flex;justify-content:center;align-items:center;gap:6px;height:120px}
.wcol{width:84px;height:120px;overflow-y:auto;scroll-snap-type:y mandatory;padding:40px 0;box-sizing:border-box;scrollbar-width:none;-webkit-overflow-scrolling:touch;text-align:center}
.wcol::-webkit-scrollbar{display:none}
.wi{height:40px;line-height:40px;font-size:28px;font-weight:300;font-variant-numeric:tabular-nums;scroll-snap-align:center;color:var(--muted);cursor:pointer}
.wi.on{color:var(--fg);font-weight:400}
.wsep{font-size:28px;font-weight:300}
.wband{position:absolute;left:50%;top:40px;width:230px;height:40px;transform:translateX(-50%);border-radius:12px;background:rgba(127,127,127,.18);pointer-events:none;z-index:-1}
.alr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;background:var(--field)}
.als b{display:block;margin:0 4px 6px}
.als ul{list-style:none;margin:0;padding:0;border-radius:12px;background:var(--field);overflow:hidden}
.als li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.als li:first-child{border-top:0}
.als li.non{justify-content:center;color:var(--muted);cursor:default}
.snl{max-height:150px;overflow:auto}
.snl .sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snl .rd{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted);flex:none}
.snl li[aria-selected="true"] .rd{box-shadow:inset 0 0 0 5px var(--accent)}
.snl .pv{width:30px;height:30px;border-radius:50%;background:var(--win);font-size:12px}
.aset{align-self:center;padding:9px 28px;font-size:15px}
.all li{cursor:default}
.all .at{flex:1;font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;min-width:0}
.all .at small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.all .adl{width:28px;height:28px;border-radius:50%;background:var(--win);color:var(--muted)}


/* Mật khẩu màn hình */
.lock{overflow:auto}
.amsg{min-height:18px;font-size:13px;opacity:.9;margin-bottom:6px;text-align:center}
.amsg.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.apw{display:flex;align-items:center;gap:6px;width:min(240px,80vw);height:36px;padding:0 4px 0 14px;border-radius:999px;background:rgba(127,127,127,.28);margin:0 auto;text-shadow:none}
.apw input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit}
.adots{display:flex;gap:12px;justify-content:center;height:16px;margin:4px 0 12px}
.adots i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.85}
.adots i.f{background:currentColor}
.apad{display:grid;grid-template-columns:repeat(3,56px);gap:10px 16px;justify-content:center}
.apad button{width:56px;height:56px;border-radius:50%;background:rgba(127,127,127,.3);color:inherit;font-size:22px;display:grid;place-items:center;text-shadow:none}
.apad button:active{background:rgba(127,127,127,.55)}
.apad .nb{background:none;font-size:18px}
.apat{width:min(210px,42vh,70vw);margin:0 auto;touch-action:none}
.apat svg{width:100%;height:auto;display:block;touch-action:none}
@media (max-height:430px){.apad{grid-template-columns:repeat(3,42px);gap:6px 12px}.apad button{width:42px;height:42px;font-size:18px}}

/* Cài đặt */
.sset{display:grid;grid-template-columns:210px minmax(0,1fr);height:100%}
.pane{padding:6px 22px 22px;overflow:auto;flex:1;min-height:0}
.pane h2{margin:0 0 14px;font-size:20px}
.grp{background:var(--field);border-radius:12px;overflow:hidden}
.rw{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 14px;border-top:1px solid var(--line)}
.rw:first-child{border-top:0}
.rw small{display:block;color:var(--muted)}
.rc2{display:flex;align-items:center}
.rg{width:150px;accent-color:var(--accent)}
.txt{border:0;border-radius:8px;padding:5px 9px;background:var(--win);color:var(--fg);outline:0;width:150px}
.tiles{display:flex;gap:14px;flex-wrap:wrap}
.ap{display:flex;flex-direction:column;align-items:center;gap:6px}
.ap .th{width:84px;height:58px;border-radius:10px;box-shadow:0 0 0 1px var(--line);display:block}
.ap[aria-pressed="true"] .th,.ap[aria-pressed="true"] .wl{box-shadow:0 0 0 3px var(--accent)}
.ap[aria-pressed="true"]>span:last-child{font-weight:600}
.th.a{background:linear-gradient(115deg,#f2f3f7 50%,#2a2b31 50%)}
.th.l{background:#f2f3f7}
.th.d{background:#2a2b31}
.wl{width:96px;height:62px;border-radius:10px;box-shadow:0 0 0 1px var(--line);display:block}
.w1{background:linear-gradient(135deg,#9be8ff,#8aa8ff 50%,#2342d8)}
.w2{background:linear-gradient(135deg,#ffb48a,#d55bd8 50%,#3a2a9a)}
.w3{background:linear-gradient(135deg,#3d5a9e,#6a45d6 50%,#0b1026)}
@container (max-width:520px){.sset{grid-template-columns:150px minmax(0,1fr)}.rg,.txt{width:110px}}
.abt{align-items:center;padding:38px 24px 20px;text-align:center}
.logo-big{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#9be8ff,#2342d8);display:grid;place-items:center;box-shadow:0 8px 22px rgba(35,66,216,.4)}

.msw[hidden],.dsh[hidden]{display:none}
@keyframes mswin{from{opacity:0}to{opacity:1}}
.mst{display:flex;align-items:center;gap:26px;width:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-block:40px 24px}
.mst::-webkit-scrollbar{display:none}
.msp{flex:none;height:1px}
.msc{flex:none;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;touch-action:pan-x;transition:transform .22s ease,opacity .22s ease;cursor:pointer}
.msh{display:flex;align-items:center;gap:8px;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.msh .ic{width:26px;height:26px;border-radius:7px}
.msx{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center}
.msv{position:relative;overflow:hidden;border-radius:18px;background:var(--win);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.18);pointer-events:none}
.mshint{position:absolute;left:0;right:0;bottom:calc(var(--base) + 20px);text-align:center;color:rgba(255,255,255,.75);font-size:12px;pointer-events:none}
/* Chạm giữ màn hình nền */
.dsh{position:absolute;left:50%;bottom:calc(var(--base) + 44px);transform:translateX(-50%);z-index:9;display:flex;gap:4px;padding:14px 10px 12px;border-radius:28px;background:rgba(40,44,60,.38);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.16);max-width:calc(100% - 12px);animation:dshin .2s ease-out}
@keyframes dshin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.dsi{display:flex;flex-direction:column;align-items:center;gap:7px;width:78px;color:#fff;font-size:12.5px;line-height:1.15;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.dsi i{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center}
.dsi svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dsi:active i{background:rgba(255,255,255,.42)}
.stage[data-ics="circle"] .ic{border-radius:50%}
.stage[data-ics="square"] .ic{border-radius:10%}

/* Tệp: màn hình 5 thư mục và thư viện ảnh/video/nhạc */
.rfl.fh{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;align-content:start;padding:16px}
.fht{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border:0;border-radius:16px;background:var(--row);color:inherit;font:inherit;cursor:pointer}
.fht:hover,.fht:active{background:var(--sel)}
.fht b{font-weight:600}.fht small{color:var(--muted);font-size:11.5px}
.fhi{width:60px;height:60px;border-radius:18px;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 60%),var(--c);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.fhi svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rfl.mgrid{padding:6px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:3px}
.mt{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--sel);overflow:hidden;border-radius:6px;cursor:pointer}
.mt img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .18s}
.mt img.ld{opacity:1}
.mdur{position:absolute;right:4px;bottom:3px;font-size:10.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75)}

/* Chọn trình duyệt thật */
.bpk{position:absolute;inset:0;z-index:14;display:grid;place-items:center;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bps{width:min(340px,90%);max-height:78%;display:flex;flex-direction:column;gap:6px;padding:18px 14px 12px;border-radius:22px;background:var(--glass);color:var(--fg);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.bps b{font-size:16px;padding:0 6px}
.bps small{color:var(--muted);font-size:12px;padding:0 6px 6px}
.bpl{overflow:auto;display:flex;flex-direction:column;gap:2px}
.bpi{display:flex;align-items:center;gap:12px;padding:9px 8px;border:0;border-radius:12px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.bpi:hover,.bpi:active{background:var(--sel)}
.bpi img{width:40px;height:40px;border-radius:22%;object-fit:cover;flex:none}
</style>
</head><body>

    <button class="tile" id="t-rot" aria-pressed="false"><span class="ci"><svg viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 0 1 3.2 10.7M2.5 8A5.5 5.5 0 0 1 12.8 5.3M12.8 2v3.5H9.3M3.2 14v-3.5h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span><b>Tự xoay</b><small id="t-rot-s">Đã tắt</small></span></button>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const stage=$('#stage'), layer=$('#wins'), dock=$('#dock'), appname=$('#appname'), desk=$('#desk');
const root=document.documentElement;
const origTheme=root.getAttribute('data-theme');
const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const jget=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const jset=(k,v)=>lsSet(k,JSON.stringify(v));
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').toLowerCase();
const pad=n=>n<10?'0'+n:''+n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date();
const MONTHS=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
const DAYS=['CN','T2','T3','T4','T5','T6','T7'];
const DAYSL=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const bus={l:{},on(e,f){(this.l[e]=this.l[e]||[]).push(f)},emit(e,a){(this.l[e]||[]).forEach(f=>f(a))}};
let P=jget('dm-prefs',{});
const pref=(k,d)=>k in P?P[k]:d;
const setPref=(k,v)=>{P[k]=v;jset('dm-prefs',P);bus.emit('ui')};
const userName=()=>lsGet('dm-user')||'Người dùng';

/* ---------- Biểu tượng ---------- */
const lpDots=(()=>{const c=['#ff5f57','#febc2e','#28c840','#0a84ff','#bf5af2','#ff9f0a','#30d5c8','#ff2d55','#8e8e93'];let s='';for(let i=0;i<9;i++)s+='<rect x="'+(2.6+(i%3)*6.8)+'" y="'+(2.6+Math.floor(i/3)*6.8)+'" width="5.2" height="5.2" rx="1.5" fill="'+c[i]+'"/>';return s})();
const trashGlyph=full=>'<svg viewBox="0 0 24 24" fill="none" stroke="#4b5060" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9.5 7V5h5v2M7 7l.8 12h8.4L17 7M10 10.5v6M14 10.5v6"/>'+(full?'<path d="M8.5 6.2l1.3-1.8M15.5 6.2l-1.3-1.8" stroke="#7b8197"/>':'')+'</svg>';
const ICONS={
  files:{bg:'linear-gradient(#7fd5ff,#1f78ff)',g:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M3 7.2A2.2 2.2 0 0 1 5.2 5h4c.6 0 1.2.3 1.6.8L12 7.2h6.8A2.2 2.2 0 0 1 21 9.4v7.4A2.2 2.2 0 0 1 18.8 19H5.2A2.2 2.2 0 0 1 3 16.8z"/></svg>'},
  launchpad:{bg:'linear-gradient(#f5f6f9,#c4c8d2)',g:'<svg viewBox="0 0 24 24">'+lpDots+'</svg>'},
  browser:{bg:'linear-gradient(#6fd0ff,#2a6df0)',g:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="3.4" ry="8"/><path d="M4 12h16M5.2 8h13.6M5.2 16h13.6"/></svg>'},
  mail:{bg:'linear-gradient(#6cc8ff,#1b82ff)',g:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12.5" rx="2.6" fill="#fff"/><path d="M4.2 8l7.8 5.6L19.8 8" fill="none" stroke="#4a8dff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'},
  calendar:{bg:'#fff',g:'<span class="cic"><b>THG '+(now.getMonth()+1)+'</b><span>'+now.getDate()+'</span></span>'},
  photos:{bg:'linear-gradient(#ffd98a,#ff6f91)',g:'<svg viewBox="0 0 24 24"><circle cx="16.5" cy="8" r="2.6" fill="#fff"/><path d="M2.5 19l6.2-8.2 4 5 2.3-2.8 6.5 6z" fill="#fff" opacity=".95"/></svg>'},
  music:{bg:'linear-gradient(#ff7a8f,#e0143c)',g:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M9 17.5V6l9-2v11.5"/><circle cx="6.8" cy="17.6" r="2.4" fill="#fff"/><circle cx="15.8" cy="15.6" r="2.4" fill="#fff"/></svg>'},
  notes:{bg:'linear-gradient(#ffe680,#ffc21f)',g:'<svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3" fill="#fff"/><g stroke="#c9a227" stroke-width="1.6" stroke-linecap="round"><path d="M8 9h8M8 12.5h8M8 16h5"/></g></svg>'},
  reminders:{bg:'#fff',g:'<svg viewBox="0 0 24 24"><g stroke="#d3d6dd" stroke-width="1.2"><path d="M10 7.4h10M10 12h10M10 16.6h10"/></g><circle cx="5.6" cy="7.4" r="1.9" fill="#ff9500"/><circle cx="5.6" cy="12" r="1.9" fill="#0a84ff"/><circle cx="5.6" cy="16.6" r="1.9" fill="#34c759"/></svg>'},
  calc:{bg:'linear-gradient(#5d5e64,#232427)',g:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2.4" fill="#a5a5ab"/><rect x="13" y="3" width="8" height="8" rx="2.4" fill="#ff9f0a"/><rect x="3" y="13" width="8" height="8" rx="2.4" fill="#505055"/><rect x="13" y="13" width="8" height="8" rx="2.4" fill="#ff9f0a"/></svg>'},
  terminal:{bg:'linear-gradient(#3b3c41,#111113)',g:'<svg viewBox="0 0 24 24" fill="none" stroke="#7CFC9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 4-5 4M12.5 17h6.5"/></svg>'},

  let l=FS[rootKey]||[];

}
function moveToTrash(rootKey,path,idx){

}
function uniqueName(l,base){
  let n=base,i=2; while(l.some(x=>x.n===n)){n=base+' '+i;i++}
  return n;
}
function addFolder(rootKey,path,base){

}
function moveItem(srcRoot,srcPath,idx,dstRoot){

  if(srcRoot===dstRoot&&!(srcPath&&srcPath.length))return;
  sl.splice(idx,1);
  const dl=fsList(dstRoot,[]); it.n=uniqueName(dl,it.n); delete it.from; dl.push(it); saveFS();
}
function restoreItem(idx){

  const to=(it.from&&FS[it.from])?it.from:'docs'; delete it.from;

}

}

      else if(id==='launchpad'||id==='downloads'){items.push({t:'Mở',fn:()=>openApp(id)})}
      else{
        const w=wins[id];

function createWin(id,arg){

let dragging=false;
function startDrag(e,label,data){
  if(e.button!==undefined&&e.button!==0)return;
  const sx=e.clientX, sy=e.clientY; let ghost=null, over=null;
  const mv=ev=>{
    if(!ghost){
      if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<7)return;
      ghost=document.createElement('div'); ghost.className='ghost'; ghost.textContent=label; stage.appendChild(ghost); dragging=true;
    }
    const sr=stage.getBoundingClientRect();
    ghost.style.left=(ev.clientX-sr.left+12)+'px'; ghost.style.top=(ev.clientY-sr.top+8)+'px';
    ghost.style.display='none'; const t=document.elementFromPoint(ev.clientX,ev.clientY); ghost.style.display='';
    const d=t&&t.closest&&t.closest('[data-drop]');
    if(over!==d){if(over)over.classList.remove('dropping');over=d;if(over)over.classList.add('dropping')}
  };
  const up=ev=>{
    document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    if(ghost){
      ghost.remove();
      if(over){over.classList.remove('dropping');dropOn(over.dataset.drop,data)}
      setTimeout(()=>{dragging=false},0);
    }
  };
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
}
function dropOn(target,data){
  if(!data||!data.root)return;
  if(target==='trash'){moveToTrash(data.root,data.path||[],data.idx)}

}

/* ---------- Âm lịch (thuật toán Hồ Ngọc Đức, múi giờ +7) ---------- */
const LUNAR=(function(){

  const jdFrom=(d,m,y)=>{const a=fl((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+fl((153*mm+2)/5)+365*yy+fl(yy/4)-fl(yy/100)+fl(yy/400)-32045};

    const M=359.2242+29.10535608*k-.0000333*T2-.00000347*T3, Mpr=306.0253+385.81691806*k+.0107306*T2+.00001236*T3, F=21.2964+390.67050646*k-.0016528*T2-.00000239*T3;

    const dt=T<-11?.001+.000839*T+.0002261*T2-.00000845*T3-.000000081*T*T3:-.000278+.000265*T+.000262*T2;
    return Jd1+C1-dt;
  }
  function sunLon(jdn){
    const T=(jdn-2451545)/36525,T2=T*T,dr=PI/180,M=357.5291+35999.0503*T-.0001559*T2-.00000048*T*T2,L0=280.46645+36000.76983*T+.0003032*T2;
    let DL=(1.9146-.004817*T-.000014*T2)*Math.sin(dr*M)+(.019993-.000101*T)*Math.sin(dr*2*M)+.00029*Math.sin(dr*3*M);
    let L=(L0+DL)*dr; L-=PI*2*fl(L/(PI*2)); return L;
  }
  const nmDay=k=>fl(newMoon(k)+.5+TZ/24), sunL=d=>fl(sunLon(d-.5-TZ/24)/PI*6);
  function m11(yy){
    const off=jdFrom(31,12,yy)-2415021, k=fl(off/29.530588853); let nm=nmDay(k);
    if(sunL(nm)>=9)nm=nmDay(k-1); return nm;
  }
  function leapOff(a11){
    const k=fl((a11-2415021.076998695)/29.530588853+.5); let last=0,i=1,arc=sunL(nmDay(k+i));
    do{last=arc;i++;arc=sunL(nmDay(k+i))}while(arc!==last&&i<14); return i-1;
  }
  function conv(dd,mm,yy){
    const dn=jdFrom(dd,mm,yy), k=fl((dn-2415021.076998695)/29.530588853);
    let ms=nmDay(k+1); if(ms>dn)ms=nmDay(k);
    let a11=m11(yy), b11=a11, ly;
    if(a11>=ms){ly=yy;a11=m11(yy-1)}else{ly=yy+1;b11=m11(yy+1)}
    const ld=dn-ms+1, diff=fl((ms-a11)/29);

  const yname=y=>CAN[(y+6)%10]+' '+CHI[(y+8)%12];
  return {conv,yname};
})();

const EXTERR={};
window.nativeExtError=k=>{if(EXTERR[k])EXTERR[k]()};
function buildWebApp(b,w,key,url,title){
  const A=window.AndroidLauncher;
  if(!A){b.innerHTML='<div class="app"><div class="bar"><strong class="t">'+title+'</strong></div>'+NATIVE_ONLY(title)+'</div>';return {}}
  b.innerHTML='<div class="wa"><div class="bar"><button class="ib wbk" aria-label="Quay lại">‹</button><strong class="t">'+title+'</strong><span class="grow"></span><button class="ib wrl" aria-label="Tải lại">⟳</button></div><div class="wab"></div></div>';
  const area=$('.wab',b); let last='', off=false, timer=null;
  function offline(){
    off=true; area.innerHTML='<div class="rnote"><b>Cần kết nối mạng</b><span>'+esc(title)+' cần Internet. Hãy bật Wi-Fi hoặc dữ liệu di động rồi thử lại.</span><div class="ir"><button class="btn wf">Mở Wi-Fi</button><button class="btn wr">Thử lại</button></div></div>';
    $('.wf',area).addEventListener('click',()=>A.openPanel('wifi'));
    $('.wr',area).addEventListener('click',()=>{last='';check()});
    A.extHide(key); last='';
  }
  function check(){
    if(!A.isOnline()){if(!off)offline();return false}
    if(off){off=false;area.innerHTML='';A.extReload(key)}
    return true;
  }
  EXTERR[key]=offline;
  const blocked=()=>(typeof lpOn!=='undefined'&&lpOn)||(typeof mcOn!=='undefined'&&mcOn)||['#spot','#nc','#cc','#ql','#lock','#off','#sw'].some(q=>{const e=$(q);return e&&!e.hidden})||Object.keys(pops).some(k=>!pops[k].hidden);
  function sync(){
    if(!w.isConnected)return;
    const vis=w.classList.contains('focus')&&!w.classList.contains('min')&&!w._leaving&&!blocked();
    if(!vis||!check()){if(last!=='hide'){A.extHide(key);last='hide'}return}
    const r=area.getBoundingClientRect(), sig=[r.left,r.top,r.width,r.height].map(Math.round).join(',');
    if(sig!==last){last=sig;A.extShow(key,url,r.left,r.top,r.width,r.height)}
  }
  timer=setInterval(sync,90);
  $('.wbk',b).addEventListener('click',()=>A.extBack(key));
  $('.wrl',b).addEventListener('click',()=>{if(check())A.extReload(key)});
  sync();
  return {destroy(){clearInterval(timer);A.extHide(key);delete EXTERR[key]}};
}

let AC=null;
function getAudio(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}
    if(AC.state==='suspended')AC.resume();
    return AC;
  }catch(e){return null}
}
function beep(){
  const a=getAudio(); if(!a)return;
  const v=pref('vol',60)/100; if(!v)return;
  [0,.25,.5].forEach(d=>{
    const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0,a.currentTime+d); g.gain.linearRampToValueAtTime(.2*v,a.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.22);
    o.connect(g); g.connect(a.destination); o.start(a.currentTime+d); o.stop(a.currentTime+d+.25);
  });
}

function buildBrowser(b,w){
  const FAV=[['Wikipedia','https://vi.wikipedia.org','#4a4d57'],['GitHub','https://github.com','#24292f'],['Anthropic','https://www.anthropic.com','#d97757'],['MDN','https://developer.mozilla.org','#1b6ac9'],['OpenStreetMap','https://www.openstreetmap.org','#3a9d54'],['Hacker News','https://news.ycombinator.com','#ff6600']];

  const tabsEl=$('.tabs',b), pg=$('.pg',b), addr=$('.addr input',b), bk=$('.bk',b), fw=$('.fw',b);
  const tab=()=>tabs.find(t=>t.id===act), url=()=>tab().hist[tab().pos];
  function label(u){
    if(u==='dm://start')return 'Trang chủ'; if(u==='dm://gioi-thieu')return 'Giới thiệu'; if(u==='dm://lich-su')return 'Lịch sử';

  function resolve(text){
    text=text.trim(); if(!text)return null;

  }

];
const MUS={idx:-1,playing:false,pos:0,dur:120,step:0,timer:null};
const SEQ=[0,2,1,3,2,4,3,1];
function musNote(midi,len,type){
  const a=getAudio(); if(!a)return;
  const v=pref('vol',60)/100; if(!v)return;
  const o=a.createOscillator(), g=a.createGain(), f=440*Math.pow(2,(midi-69)/12), t=a.currentTime;
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16*v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+len);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+len+.05);
}
function musTick(){
  const tr=TRK[MUS.idx], st=60000/tr.bpm/2;
  const s=MUS.step, deg=SEQ[s%8], oct=Math.floor(s/8)%2?12:0;
  musNote(tr.root+tr.sc[deg]+oct,(st/1000)*2.4,tr.wave);
  if(s%8===0)musNote(tr.root-12+tr.sc[0],(st/1000)*6,'sine');
  MUS.step++; MUS.pos+=st/1000;
  if(MUS.pos>=MUS.dur){musNext();return}
  bus.emit('music');
}
function musLoop(){
  clearInterval(MUS.timer);
  if(!MUS.playing)return;
  MUS.timer=setInterval(musTick,60000/TRK[MUS.idx].bpm/2);
}
function musPlay(i){
  getAudio();
  MUS.idx=i; MUS.pos=0; MUS.step=0; MUS.playing=true; musLoop(); bus.emit('music');
}
function musToggle(){
  if(MUS.idx<0){musPlay(0);return}

}
function musNext(){musPlay((MUS.idx+1)%TRK.length)}

function buildTerminal(b,w){
  b.innerHTML='<div class="term"><div class="bar"><strong class="t">Terminal — zsh</strong></div><div class="tout" role="log"></div></div>';
  const out=$('.tout',b);
  const DIRS={Desktop:'desk',Documents:'docs',Downloads:'down',Pictures:'pics'};
  let cwd={root:null,path:[]}, hist=[], hp=0;
  const dirName=()=>{
    if(!cwd.root)return '~';
    const rn=Object.keys(DIRS).find(k=>DIRS[k]===cwd.root);
    let n='~/'+rn, l=FS[cwd.root];
    cwd.path.forEach(i=>{n+='/'+l[i].n;l=l[i].items});
    return n;
  };
  const cur=()=>cwd.root?fsList(cwd.root,cwd.path):null;

    const l=document.createElement('div'); l.className='tl2 pr';
    l.innerHTML='<span class="ps">'+esc(userName().toLowerCase().replace(/\s+/g,''))+'@desktop-mini <b>'+esc(dirName())+'</b> %</span> <input class="tin" spellcheck="false" autocomplete="off" aria-label="Dòng lệnh">';

      else if(e.key==='ArrowDown'){e.preventDefault();if(hp<hist.length-1){hp++;i.value=hist[hp]}else{hp=hist.length;i.value=''}}
    });
  }
  const find=(l,name)=>l.findIndex(x=>norm(x.n)===norm(name));
  function run(line){
    const m=line.trim().match(/^(\S+)\s*(.*)$/); if(!m)return;
    const cmd=m[1], rest=m[2].replace(/^["']|["']$/g,'');
    switch(cmd){

      case 'pwd':print('/Users/'+userName().toLowerCase().replace(/\s+/g,'')+(cwd.root?dirName().slice(1):''));break;

        const i=find(l,rest.replace(/\/$/,''));
        if(i>=0&&l[i].x==='folder')cwd.path.push(i);else print('cd: không tìm thấy thư mục: '+rest,'er');
        break}
      case 'cat':{const l=cur();if(!l){print('cat: hãy vào một thư mục trước','er');break}const i=find(l,rest);if(i<0)print('cat: không tìm thấy: '+rest,'er');else if(l[i].x==='folder')print('cat: '+rest+': là một thư mục','er');else if(l[i].x==='md')print('# '+l[i].n.replace(/\.md$/,'')+'\nNội dung mẫu của tệp văn bản này.');else print('cat: '+rest+': tệp nhị phân','er');break}

  out.addEventListener('click',()=>{const i=$('.tin',out);if(i&&!getSelection().toString())i.focus()});

function buildClock(b,w){
  const CITIES=[['Hà Nội','Asia/Ho_Chi_Minh']];
  b.innerHTML='<div class="app clk2"><div class="bar"><div class="nv seg3"><button data-k="world">Giờ thế giới</button><button data-k="sw">Bấm giờ</button><button data-k="tm">Hẹn giờ</button></div></div><div class="cbody"></div></div>';
  const body=$('.cbody',b); let tab='world', timers=[];
  const stop=()=>{timers.forEach(clearInterval);timers=[]};
  function face(i){return '<svg class="af" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--field)" stroke="var(--line)"/>'+[...Array(12)].map((_,k)=>'<line x1="50" y1="8" x2="50" y2="'+(k%3?12:15)+'" stroke="var(--muted)" stroke-width="'+(k%3?1:2)+'" transform="rotate('+k*30+' 50 50)"/>').join('')+'<line class="hh" x1="50" y1="50" x2="50" y2="28" stroke="var(--fg)" stroke-width="3.2" stroke-linecap="round"/><line class="mh" x1="50" y1="50" x2="50" y2="17" stroke="var(--fg)" stroke-width="2.4" stroke-linecap="round"/><line class="sh" x1="50" y1="56" x2="50" y2="12" stroke="#ff9f0a" stroke-width="1.2" stroke-linecap="round"/><circle cx="50" cy="50" r="2.4" fill="#ff9f0a"/></svg>'}
  function parts(tz){
    const f=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    const o={}; f.formatToParts(new Date()).forEach(p=>{o[p.type]=+p.value}); if(o.hour===24)o.hour=0; return o;
  }
  const ymd=tz=>new Date().toLocaleDateString('en-CA',{timeZone:tz});
  function worldTick(){
    $$('.wc',body).forEach(c=>{
      const tz=c.dataset.tz, p=parts(tz);
      $('.hh',c).setAttribute('transform','rotate('+((p.hour%12)*30+p.minute*.5)+' 50 50)');
      $('.mh',c).setAttribute('transform','rotate('+(p.minute*6+p.second*.1)+' 50 50)');
      $('.sh',c).setAttribute('transform','rotate('+p.second*6+' 50 50)');
      $('.wt',c).textContent=pad(p.hour)+':'+pad(p.minute);
      const a=ymd(tz), l=ymd(Intl.DateTimeFormat().resolvedOptions().timeZone);
      $('.wd',c).textContent=a===l?'Hôm nay':(a<l?'Hôm qua':'Ngày mai');
    });
  }
  function show(){
    stop();
    $$('.seg3 button',b).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.k===tab)));
    if(tab==='world'){
      body.innerHTML='<div class="wgrid">'+CITIES.map(c=>'<div class="wc" data-tz="'+c[1]+'">'+face()+'<b>'+c[0]+'</b><span class="wt"></span><small class="wd"></small></div>').join('')+'</div>';
      worldTick(); timers.push(setInterval(worldTick,1000));
    }else if(tab==='sw'){
      let run=false, t0=0, el=0, laps=[];
      body.innerHTML='<div class="swb"><div class="big sd">00:00.00</div><div class="swc"><button class="btn lp2">Vòng</button><button class="btn pri st">Bắt đầu</button></div><ol class="laps"></ol></div>';
      const sd=$('.sd',body), st=$('.st',body), lp=$('.lp2',body), ol=$('.laps',body);
      const f=ms=>{const c=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return pad(m)+':'+pad(s)+'.'+pad(c)};
      const upd=()=>{sd.textContent=f(run?el+(performance.now()-t0):el)};
      st.addEventListener('click',()=>{if(run){el+=performance.now()-t0;run=false;st.textContent='Tiếp tục';lp.textContent='Đặt lại'}else{t0=performance.now();run=true;st.textContent='Dừng';lp.textContent='Vòng'}upd()});
      lp.addEventListener('click',()=>{
        if(run){laps.unshift(f(el+performance.now()-t0))}else{el=0;laps=[];st.textContent='Bắt đầu';lp.textContent='Vòng'}
        ol.innerHTML=laps.map((x,i)=>'<li><span>Vòng '+(laps.length-i)+'</span><span>'+x+'</span></li>').join(''); upd();
      });
      timers.push(setInterval(upd,47));
    }else{
      const NA2=()=>window.AndroidLauncher||null;
      let AL=jget('dm-alarms',[]), SND=[{name:'Mặc định',uri:''}], sel=0, rep=false;
      try{const n=NA2();if(n&&n.getAlarmSounds){const l=JSON.parse(n.getAlarmSounds());if(l.length)SND=l}}catch(x){}
      const now0=new Date(); let hh=now0.getHours(), mm=(now0.getMinutes()+1)%60; if(mm===0)hh=(hh+1)%24;
      const saveAL=()=>jset('dm-alarms',AL);
      body.innerHTML='<div class="alm"><div class="whl"><div class="wcol" data-w="h" role="listbox" aria-label="Chọn giờ"></div><b class="wsep">:</b><div class="wcol" data-w="m" role="listbox" aria-label="Chọn phút"></div><i class="wband"></i></div>'+
        '<div class="alr"><span>Lặp lại hằng ngày</span>'+tgl(false,'','Lặp lại hằng ngày')+'</div>'+
        '<div class="als"><b>Âm thanh báo thức</b><ul class="snl"></ul></div>'+
        '<button class="btn pri aset" type="button">Đặt báo thức</button>'+
        '<div class="als"><b>Báo thức đã đặt</b><ul class="all"></ul></div></div>';
      const cols={h:$('[data-w="h"]',body), m:$('[data-w="m"]',body)};
      const IH=40;
      const fillCol=(c,max)=>{c.innerHTML=[...Array(max)].map((_,i)=>'<div class="wi" data-v="'+i+'">'+pad(i)+'</div>').join('')};
      fillCol(cols.h,24); fillCol(cols.m,60);
      const setCol=(c,v)=>{c.scrollTop=v*IH};
      const getCol=c=>Math.max(0,Math.round(c.scrollTop/IH));
      requestAnimationFrame(()=>{setCol(cols.h,hh);setCol(cols.m,mm)});
      ['h','m'].forEach(k=>{
        const c=cols[k]; let t=null;
        c.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{const v=getCol(c);if(k==='h')hh=Math.min(23,v);else mm=Math.min(59,v);$$('.wi',c).forEach(x=>x.classList.toggle('on',+x.dataset.v===v))},80)});
        c.addEventListener('click',e=>{const x=e.target.closest('.wi');if(x)c.scrollTo({top:+x.dataset.v*IH,behavior:'smooth'})});
      });
      setTimeout(()=>{$$('.wi',cols.h)[hh]&&$$('.wi',cols.h)[hh].classList.add('on');$$('.wi',cols.m)[mm]&&$$('.wi',cols.m)[mm].classList.add('on')},60);
      const rtg=$('.alr .tg',body);
      rtg.addEventListener('click',()=>{rep=!rep;rtg.setAttribute('aria-checked',String(rep))});
      const snl=$('.snl',body);
      const drawSnd=()=>{snl.innerHTML=SND.map((x,i)=>'<li data-i="'+i+'" aria-selected="'+(i===sel)+'"><span class="rd"></span><span class="sn">'+esc(x.name)+'</span><button type="button" class="pv" data-p="'+i+'" aria-label="Nghe thử">▶</button></li>').join('')};
      drawSnd();
      snl.addEventListener('click',e=>{
        const pv=e.target.closest('.pv');
        if(pv){const n=NA2();const u=SND[+pv.dataset.p].uri;if(n&&n.previewSound)n.previewSound(u);else beep();return}
        const li=e.target.closest('li[data-i]'); if(li){sel=+li.dataset.i;drawSnd()}
      });
      const all=$('.all',body);
      const drawAL=()=>{
        all.innerHTML=AL.length?AL.slice().sort((p,q)=>p.h*60+p.m-(q.h*60+q.m)).map(x=>'<li data-id="'+x.id+'"><span class="at">'+pad(x.h)+':'+pad(x.m)+'<small>'+(x.rep?'Hằng ngày':'Một lần')+' · '+esc(x.name)+'</small></span>'+tgl(x.on,'','Bật tắt báo thức')+'<button type="button" class="adl" aria-label="Xóa báo thức">✕</button></li>').join(''):'<li class="non">Chưa có báo thức nào</li>';
      };
      drawAL();
      const arm=x=>{const n=NA2();if(n&&n.setAlarm){const ok=n.setAlarm(x.id,x.h,x.m,x.uri||'',!!x.rep,'');if(!ok)notify({app:'Đồng hồ',title:'Không đặt được báo thức',body:'Hãy cấp quyền thông báo cho ứng dụng rồi thử lại.',icon:'clock'})}};
      const disarm=x=>{const n=NA2();if(n&&n.cancelAlarm)n.cancelAlarm(x.id)};
      $('.aset',body).addEventListener('click',()=>{
        const x={id:(Date.now()%2000000000)|0,h:hh,m:mm,uri:SND[sel].uri,name:SND[sel].name,rep:rep,on:true};
        AL.push(x); saveAL(); arm(x); drawAL();
        notify({app:'Đồng hồ',title:'Đã đặt báo thức '+pad(hh)+':'+pad(mm),body:SND[sel].name,icon:'clock'});
      });
      all.addEventListener('click',e=>{
        const li=e.target.closest('li[data-id]'); if(!li)return;
        const x=AL.find(q=>String(q.id)===li.dataset.id); if(!x)return;
        if(e.target.closest('.adl')){disarm(x);AL=AL.filter(q=>q!==x);saveAL();drawAL();return}
        if(e.target.closest('.tg')){x.on=!x.on;saveAL();if(x.on)arm(x);else disarm(x);drawAL()}
      });
      /* Bản chạy trên trình duyệt (không có app Android): báo bằng âm bíp khi đúng giờ */
      timers.push(setInterval(()=>{
        if(NA2()&&NA2().setAlarm)return;
        const d=new Date(); if(d.getSeconds()!==0)return;
        AL.forEach(x=>{if(x.on&&x.h===d.getHours()&&x.m===d.getMinutes()){beep();notify({app:'Đồng hồ',title:'Báo thức '+pad(x.h)+':'+pad(x.m),body:x.name,icon:'clock'});if(!x.rep){x.on=false;saveAL()}}});
      },1000));
    }
  }
  $$('.seg3 button',b).forEach(x=>x.addEventListener('click',()=>{tab=x.dataset.k;show()}));
  show();
  return {destroy:stop};
}

const sq=$('#sq'), sres=$('#sres'); let sel=0, hits=[];
function calcExpr(t){
  if(!/^[\d\s+\-*/().,%x×÷]+$/.test(t)||!/[+\-*/%x×÷]/.test(t)||!/\d/.test(t))return null;
  try{
    const e=t.replace(/,/g,'.').replace(/[x×]/g,'*').replace(/÷/g,'/').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
    const r=Function('"use strict";return ('+e+')')();
    return (typeof r==='number'&&isFinite(r))?String(+r.toPrecision(12)).replace('.',','):null;
  }catch(e){return null}
}
function openAny(it,ref){
  if(it.x==='folder'&&ref){openApp('files',{root:ref.root,path:ref.path.concat(ref.idx)});return}
  if(it.x==='jpg'||it.x==='png'){openApp('photos',{file:it.n});return}
  if(it.x==='mp3'){openApp('music',{play:true});return}
  if(it.x==='md'){openApp('notes',{file:it.n});return}
  quickLook(it);
}
function renderSpot(){
  const raw=sq.value.trim(), term=norm(raw); hits=[]; sel=0; sres.innerHTML='';
  if(term){
    const c=calcExpr(raw); if(c)hits.push({ic:'calc',t:'= '+c,s:'Máy tính',fn:()=>{try{navigator.clipboard.writeText(c)}catch(e){}openApp('calc')}});
    LP_APPS.forEach(id=>{if(norm(APPS[id].name).indexOf(term)>=0)hits.push({ic:id,t:APPS[id].name,s:'Ứng dụng',fn:()=>openApp(id)})});
    hits=hits.slice(0,8);
  }
  hits.forEach((h,i)=>{
    const r=document.createElement('button'); r.className='sr'; r.setAttribute('aria-selected',String(i===sel));
    r.innerHTML=iconHTML(h.ic)+'<span>'+esc(h.t)+'</span><small>'+esc(h.s)+'</small>';
    r.addEventListener('click',()=>{closeAllPopups();h.fn()});
    sres.appendChild(r);
  });
  if(term&&!hits.length)sres.innerHTML='<div class="sr nores">Không có kết quả</div>';
}
function openSpot(){closeAllPopups();if(lpOn)closeLP();pops.spot.hidden=false;sq.value='';renderSpot();setTimeout(()=>sq.focus(),0)}
$('#srch').addEventListener('click',e=>{e.stopPropagation();if(pops.spot.hidden)openSpot();else closeAllPopups()});
sq.addEventListener('input',renderSpot);
sq.addEventListener('keydown',e=>{
  const mark=()=>$$('.sr',sres).forEach((r,i)=>r.setAttribute('aria-selected',String(i===sel)));
  if(e.key==='ArrowDown'&&hits.length){sel=(sel+1)%hits.length;mark();e.preventDefault()}
  else if(e.key==='ArrowUp'&&hits.length){sel=(sel-1+hits.length)%hits.length;mark();e.preventDefault()}
  else if(e.key==='Enter'&&hits.length){const h=hits[sel];closeAllPopups();h.fn()}
});

let mcLabels=[];
function enterMC(){
  closeAllPopups(); if(lpOn)closeLP();
  const ws=$$('.win',layer).filter(w=>!w.classList.contains('min')&&!w._leaving);
  mcOn=true; $('#mcx').hidden=false; stage.classList.remove('mcx'); stage.classList.add('mc');
  $('#mcbg').innerHTML='<div class="mcsp"><span>Desktop 1</span></div>'+(ws.length?'':'<div class="mcnone">Không có cửa sổ nào đang mở</div>');
  const sr=stage.getBoundingClientRect(), base=parseFloat(getComputedStyle(stage).getPropertyValue('--base'))||54;
  const x0=24, y0=84, W=sr.width-48, H=sr.height-y0-(base+44), gap=22, n=ws.length||1;
  const cols=Math.ceil(Math.sqrt(n*W/Math.max(H,1))), rows=Math.ceil(n/cols);
  const cw=(W-(cols-1)*gap)/cols, ch=(H-(rows-1)*gap-rows*20)/rows;
  mcLabels.forEach(l=>l.remove()); mcLabels=[];
  ws.forEach((w,i)=>{
    const c=i%cols, r=Math.floor(i/cols);
    const s=Math.min(cw/w.offsetWidth,ch/w.offsetHeight,.85);
    const tx=x0+c*(cw+gap)+(cw-w.offsetWidth*s)/2, ty=y0+r*(ch+gap+20)+(ch-w.offsetHeight*s)/2;
    w.style.transformOrigin='0 0';
    w.style.transform='translate('+(tx-w.offsetLeft)+'px,'+(ty-w.offsetTop)+'px) scale('+s+')';
    const l=document.createElement('div'); l.className='mcl'; l.textContent=APPS[w.dataset.app].name;
    l.style.left=tx+'px'; l.style.top=(ty+w.offsetHeight*s+6)+'px'; l.style.width=(w.offsetWidth*s)+'px';
    layer.appendChild(l); mcLabels.push(l);
  });
}
function exitMC(pick){
  if(!mcOn)return; mcOn=false; $('#mcx').hidden=true;
  $$('.win',layer).forEach(w=>{w.style.transform=''});
  mcLabels.forEach(l=>l.remove()); mcLabels=[];
  stage.classList.add('mcx'); stage.classList.remove('mc');
  if(pick&&wins[pick.dataset.app])focusWin(pick);
  setTimeout(()=>{if(!mcOn)stage.classList.remove('mcx')},reduce?0:380);
}

/* --- Mật khẩu màn hình thật: ký tự (ngang), PIN hoặc hình vẽ (dọc) --- */
const sha256=(()=>{
  const K=[],H0=[]; let n=2,c=0; const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
  while(c<64){if(isP(n)){if(c<8)H0.push((Math.pow(n,.5)%1)*4294967296|0);K.push((Math.pow(n,1/3)%1)*4294967296|0);c++}n++}
  const rr=(x,k)=>(x>>>k)|(x<<(32-k));
  return str=>{
    const b=unescape(encodeURIComponent(str)), l=b.length, w=[];
    for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
    w[l>>2]|=0x80<<(24-(l%4)*8);
    const len=(((l+8)>>6)+1)*16; for(let i=0;i<len;i++)if(w[i]===undefined)w[i]=0; w[len-1]=l*8;
    let h=H0.slice();
    for(let o=0;o<len;o+=16){
      const m=w.slice(o,o+16);
      for(let i=16;i<64;i++){const x=m[i-15],y=m[i-2];m[i]=(m[i-16]+(rr(x,7)^rr(x,18)^(x>>>3))+m[i-7]+(rr(y,17)^rr(y,19)^(y>>>10)))|0}
      let [a,b2,c2,d,e,f,g,hh]=h;
      for(let i=0;i<64;i++){
        const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+m[i])|0, t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b2)^(a&c2)^(b2&c2)))|0;
        hh=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b2;b2=a;a=(t1+t2)|0;
      }
      h=[h[0]+a|0,h[1]+b2|0,h[2]+c2|0,h[3]+d|0,h[4]+e|0,h[5]+f|0,h[6]+g|0,h[7]+hh|0];
    }
    return h.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
  };
})();
const LK='dm-lock', lk=()=>jget(LK,{});
const hasLock=()=>{const o=lk();return !!(o.pw||o.pin||o.pat)};
const lkHash=(k,v)=>{let o=lk();if(!o.s){o.s=Math.random().toString(36).slice(2)+Date.now().toString(36);jset(LK,o)}return sha256(lk().s+'|'+k+'|'+v)};
const lkSet=(k,v)=>{const h=lkHash(k,v),o=lk();o[k]=h;if(k==='pin')o.pl=v.length;jset(LK,o)};
const lkDel=k=>{const o=lk();delete o[k];if(k==='pin')delete o.pl;jset(LK,o)};
const lkChk=(k,v)=>lk()[k]===lkHash(k,v);
const isPortrait=()=>window.innerHeight>=window.innerWidth;
/* Ngang -> mật khẩu ký tự; dọc -> PIN hoặc hình vẽ theo lựa chọn. Nếu kiểu cần chưa đặt thì dùng kiểu đã đặt, không để lọt khóa. */
function lockKind(){const o=lk(),want=isPortrait()?pref('lockPm','pin'):'pw';return o[want]?want:(['pw','pin','pat'].find(k=>o[k])||'pw')}

function authUI(el,kind,o){
  el.innerHTML='<div class="amsg"></div><div class="abody"></div>';
  const msg=$('.amsg',el), bd=$('.abody',el); msg.textContent=o.title||'';
  const fail=t=>{msg.textContent=t;msg.classList.remove('shake');void msg.offsetWidth;msg.classList.add('shake')};
  const submit=v=>{const r=o.onSubmit(v); if(r!==true&&r!==undefined)fail(typeof r==='string'?r:'Sai, thử lại'); return r===true};
  if(kind==='pw'){
    bd.innerHTML='<form class="apw" autocomplete="off"><input type="password" autocomplete="off" placeholder="Mật khẩu" aria-label="Mật khẩu"><button class="go" type="submit" aria-label="Xác nhận"><svg viewBox="0 0 16 16"><path d="M3 8h9M8.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>';
    const f=$('form',bd), inp=$('input',bd);
    f.addEventListener('submit',e=>{e.preventDefault();const v=inp.value;if(!submit(v)){inp.value='';inp.focus()}});
    setTimeout(()=>inp.focus(),80);
  }else if(kind==='pin'){
    let v='';
    bd.innerHTML='<div class="adots"></div><div class="apad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button type="button" data-d="'+n+'">'+n+'</button>').join('')+'<button type="button" class="nb" data-a="ok" aria-label="Xác nhận">✓</button><button type="button" data-d="0">0</button><button type="button" class="nb" data-a="del" aria-label="Xóa số">⌫</button></div>';
    const dots=$('.adots',bd);
    const draw=()=>{const n=Math.max(o.len||4,v.length);dots.innerHTML=[...Array(n)].map((_,i)=>'<i'+(i<v.length?' class="f"':'')+'></i>').join('')};
    const send=()=>{const x=v; if(!submit(x)){v='';draw()}};
    draw();
    bd.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b)return;
      if(b.dataset.d!==undefined){if(v.length<8){v+=b.dataset.d;draw();if(o.len&&v.length===o.len)send()}}
      else if(b.dataset.a==='del'){v=v.slice(0,-1);draw()}
      else if(b.dataset.a==='ok'){if(v.length>=4)send();else fail('Tối thiểu 4 số')}
    });
  }else{
    const P=[...Array(9)].map((_,i)=>[20+40*(i%3),20+40*Math.floor(i/3)]);
    bd.innerHTML='<div class="apat"><svg viewBox="0 0 120 120"><polyline fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>'+P.map((p,i)=>'<circle data-i="'+i+'" cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="currentColor" opacity=".55"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="12" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"/>').join('')+'</svg></div>';
    const svg=$('svg',bd), pl=$('polyline',bd); let seq=[], drag=false, busy=false;
    const pt=e=>{const r=svg.getBoundingClientRect();return [(e.clientX-r.left)*120/r.width,(e.clientY-r.top)*120/r.height]};
    const hit=(x,y)=>{for(let i=0;i<9;i++)if(Math.hypot(P[i][0]-x,P[i][1]-y)<14)return i;return -1};
    const lit=()=>$$('circle[data-i]',svg).forEach(c=>c.setAttribute('opacity',seq.indexOf(+c.dataset.i)>=0?'1':'.55'));
    const line=(x,y)=>{pl.setAttribute('points',seq.map(i=>P[i].join(',')).concat(x!=null?[x+','+y]:[]).join(' '))};
    const reset=()=>{seq=[];line();lit();busy=false};
    svg.addEventListener('pointerdown',e=>{if(busy)return;e.preventDefault();drag=true;seq=[];try{svg.setPointerCapture(e.pointerId)}catch(x){}const [x,y]=pt(e),i=hit(x,y);if(i>=0)seq.push(i);line(x,y);lit()});
    svg.addEventListener('pointermove',e=>{if(!drag)return;const [x,y]=pt(e),i=hit(x,y);if(i>=0&&seq.indexOf(i)<0)seq.push(i);line(x,y);lit()});
    const end=()=>{
      if(!drag)return; drag=false; line(); busy=true;
      if(seq.length<4){fail('Nối ít nhất 4 điểm');setTimeout(reset,500);return}
      const ok=submit(seq.join('')); setTimeout(reset,ok?0:600);
    };
    svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  }
}
function lkModal(title){

const LKN={pw:['mật khẩu ký tự','Nhập mật khẩu mới (tối thiểu 4 ký tự)','Nhập lại mật khẩu'],pin:['mã PIN','Nhập mã PIN mới (4-8 số)','Nhập lại mã PIN'],pat:['hình vẽ','Vẽ hình mở khóa mới (nối ít nhất 4 điểm)','Vẽ lại để xác nhận']};
function lkVerifyThen(kind,title,next){
  const o=lk(); if(!o[kind]){next();return}
  const M=lkModal(title);
  authUI(M.el,kind,{len:kind==='pin'?o.pl:0,title:'Nhập '+LKN[kind][0]+' hiện tại',onSubmit:v=>{if(!lkChk(kind,v))return 'Sai, thử lại';M.close();next();return true}});
}
function lkSetFlow(kind,done){
  lkVerifyThen(kind,'Đổi '+LKN[kind][0],()=>{
    const M=lkModal('Đặt '+LKN[kind][0]); let first=null;
    const stepNew=()=>authUI(M.el,kind,{title:LKN[kind][1],onSubmit:v=>{
      if(kind==='pw'&&v.length<4)return 'Tối thiểu 4 ký tự';
      if(kind==='pin'&&v.length<4)return 'Tối thiểu 4 số';
      first=v; stepConf(); return true;
    }});
    const stepConf=()=>authUI(M.el,kind,{title:LKN[kind][2],onSubmit:v=>{
      if(v!==first){first=null;stepNew();return true}
      lkSet(kind,v); M.close(); done(); return true;
    }});
    stepNew();
  });
}

      c.querySelectorAll('iframe,video,audio').forEach(n=>n.remove());
      const a=w.querySelectorAll('textarea,input,select'), b=c.querySelectorAll('textarea,input,select');
      a.forEach((n,i)=>{if(b[i])b[i].value=n.value});
      c.classList.remove('min','focus','max');
      c.style.cssText='position:absolute;left:0;top:0;display:flex;margin:0;opacity:1;width:'+ow+'px;height:'+oh+'px;transform:scale('+sc+');transform-origin:0 0;pointer-events:none';

      if(Math.abs(ddy)>10&&Math.abs(ddy)>Math.abs(ddx)){mv=true;dy=Math.min(0,ddy);card.style.transition='none';card.style.transform='translateY('+dy+'px)';card.style.opacity=String(Math.max(.2,1+dy/420))}

  /* Pin thật */
  function realBatt(){const o=safe(()=>JSON.parse(A.getBattery()),{});if(o.level!=null){BAT.level=o.level;BAT.charging=!!o.charging;BAT.real=true;battUpdate()}}
  setInterval(realBatt,10000); realBatt(); setTimeout(realBatt,1500);
  /* Nhạc thật trong máy */
  const grad=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return ['hsl('+(h%360)+',75%,72%)','hsl('+((h+50)%360)+',70%,58%)']};
  function loadTracks(){
    const l=safe(()=>JSON.parse(A.getTracks()),[]);
    if(l.length===TRK.length&&TRK.length&&TRK[0].real)return;
    TRK.length=0; l.forEach(t=>TRK.push({t:t.t,a:t.a,id:t.id,dur:t.dur,real:true,c:grad(t.t)}));
  }
  loadTracks();
  let poll=null;
  const stopPoll=()=>{clearInterval(poll);poll=null};
  let msig='';
  function mnotify(){
    if(MUS.idx<0||!TRK[MUS.idx])return;
    const g=MUS.idx+'|'+MUS.playing; if(g===msig)return; msig=g;
    safe(()=>A.mediaNotify(TRK[MUS.idx].t,TRK[MUS.idx].a,MUS.playing));
  }
  bus.on('music',mnotify);
  window.nativeEnded=()=>musNext();
  window.nativeMedia=c=>{if(c==='prev')musPrev();else if(c==='next')musNext();else if(c==='toggle')musToggle()};
  musPlay=function(i){
    const t=TRK[i]; if(!t)return;
    MUS.idx=i;MUS.pos=0;MUS.dur=Math.max(1,t.dur);MUS.playing=!!safe(()=>A.playTrack(t.id),false);
    clearInterval(poll); if(MUS.playing)poll=setInterval(musPoll,500);
    msig=''; bus.emit('music');
  };
  function musPoll(){
    const s=safe(()=>JSON.parse(A.getPlayerState()),{});
    if(s.pos!=null){MUS.pos=s.pos/1000;if(s.dur>0)MUS.dur=s.dur/1000;MUS.playing=!!s.playing}
    bus.emit('music');
  }
  musToggle=function(){
    if(!TRK.length)return;
    if(MUS.idx<0){musPlay(0);return}
    if(MUS.playing){safe(()=>A.pauseMusic());MUS.playing=false;stopPoll()}
    else{safe(()=>A.resumeMusic());MUS.playing=true;clearInterval(poll);poll=setInterval(musPoll,500)}
    bus.emit('music');
  };
  musNext=function(){if(TRK.length)musPlay((MUS.idx+1)%TRK.length)};
  musPrev=function(){if(!TRK.length)return;if(MUS.pos>4)musPlay(MUS.idx);else musPlay((MUS.idx-1+TRK.length)%TRK.length)};
  musSeek=function(s){MUS.pos=s;safe(()=>A.seekTo(Math.round(s*1000)));bus.emit('music')};
  musHalt=function(){safe(()=>A.stopMusic());safe(()=>A.mediaStop());MUS.playing=false;msig='';stopPoll();bus.emit('music')};
  /* Ảnh thật trong máy */
  function loadPhotos(){
    const l=safe(()=>JSON.parse(A.getPhotos()),[]);
    PH.length=0; l.forEach(p=>{const e=['','','','','',p.n];e.pid=p.id;PH.push(e)});
  }
  loadPhotos();
  const q=[]; let run=false;
  function pump(){
    if(run)return; run=true;
    (function next(){
      const img=q.shift(); if(!img){run=false;return}
      if(!img.isConnected||img.src){next();return}
      const big=!!img.closest('.pv');
      setTimeout(()=>{const d=safe(()=>A.getPhotoData(+img.dataset.pid,big?1080:260),'');if(d)img.src=d;next()},0);
    })();
  }
  new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{
    if(n.nodeType!==1)return;
    (n.matches&&n.matches('img.rp')?[n]:[...n.querySelectorAll('img.rp')]).forEach(i=>{if(big_ok(i))q.push(i)});
  }));pump()}).observe(document.body,{childList:true,subtree:true});
  function big_ok(i){return !i.getAttribute('src')}
  window.nativeReload=function(){loadTracks();loadPhotos();sync();realBatt();insets();if(window.devCalReset)devCalReset()};
  /* Thư = Gmail trong cửa sổ */
  APPS.mail.name='Gmail'; const mb=dockBtn('mail'); if(mb){mb.dataset.label='Gmail';mb.setAttribute('aria-label','Gmail')}
  /* Giới thiệu: thông tin máy thật */
  const inf=safe(()=>JSON.parse(A.getInfo()),{});
  if(inf.model){window.NATIVE_INFO=inf}
})()}

})();
</script>
</body></html>
