  live(w,'music',update); live(w,'slider',update);
  update();
  if(arg&&arg.play)musPlay(MUS.idx>=0?MUS.idx:0);
  return {open(a){if(a&&a.play&&!MUS.playing)musPlay(MUS.idx>=0?MUS.idx:0)}};
}

/* ---------- Terminal ---------- */
function buildTerminal(b,w){
  b.innerHTML='<div class="term"><div class="bar"><strong class="t">Terminal — zsh</strong></div><div class="tout" role="log"></div></div>';
  const out=$('.tout',b);
  const DIRS={Desktop:'desk',Documents:'docs',Downloads:'down',Pictures:'pics'};
  let cwd={root:null,path:[]}, hist=[], hp=0;
  const dirName=()=>{
    if(!cwd.root)return '~';
    const rn=Object.keys(DIRS).find(k=>DIRS[k]===cwd.root);
    let n='~/'+rn, l=FS[cwd.root];
    cwd.path.forEach(i=>{n+='/'+l[i].n;l=l[i].items});
    return n;
  };
  const cur=()=>cwd.root?fsList(cwd.root,cwd.path):null;
  function print(t,cls){const d=document.createElement('div');d.className='tl2'+(cls?' '+cls:'');d.textContent=t;out.appendChild(d);out.scrollTop=out.scrollHeight}
  function prompt(){
    const l=document.createElement('div'); l.className='tl2 pr';
    l.innerHTML='<span class="ps">'+esc(userName().toLowerCase().replace(/\s+/g,''))+'@desktop-mini <b>'+esc(dirName())+'</b> %</span> <input class="tin" spellcheck="false" autocomplete="off" aria-label="Dòng lệnh">';
    out.appendChild(l); const i=$('.tin',l); i.focus(); out.scrollTop=out.scrollHeight;
    i.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        const v=i.value; i.replaceWith(Object.assign(document.createElement('span'),{textContent:v})); if(v.trim()){hist.push(v);hp=hist.length}
        run(v); if(w.isConnected&&!w._closing)prompt();
      }else if(e.key==='ArrowUp'){e.preventDefault();if(hp>0){hp--;i.value=hist[hp]}}
      else if(e.key==='ArrowDown'){e.preventDefault();if(hp<hist.length-1){hp++;i.value=hist[hp]}else{hp=hist.length;i.value=''}}
    });
  }
  const find=(l,name)=>l.findIndex(x=>norm(x.n)===norm(name));
  function run(line){
    const m=line.trim().match(/^(\S+)\s*(.*)$/); if(!m)return;
    const cmd=m[1], rest=m[2].replace(/^["']|["']$/g,'');
    switch(cmd){
      case 'help':print('Lệnh có sẵn: help, ls, cd, pwd, cat, mkdir, touch, rm, echo, open, date, whoami, hostname, uname, uptime, history, neofetch, clear, exit');break;
      case 'pwd':print('/Users/'+userName().toLowerCase().replace(/\s+/g,'')+(cwd.root?dirName().slice(1):''));break;
      case 'ls':{const l=cur();print(l?(l.length?l.map(x=>x.x==='folder'?x.n+'/':x.n).join('\n'):'(trống)'):Object.keys(DIRS).map(k=>k+'/').join('\n'));break}
      case 'cd':{
        if(!rest||rest==='~'||rest==='~/'){cwd={root:null,path:[]};break}
        if(rest==='..'){if(cwd.path.length)cwd.path.pop();else cwd={root:null,path:[]};break}
        const l=cur();
        if(!l){const k=Object.keys(DIRS).find(x=>norm(x)===norm(rest.replace(/^~\//,'').replace(/\/$/,'')));if(k)cwd={root:DIRS[k],path:[]};else print('cd: không tìm thấy: '+rest,'er');break}
        const i=find(l,rest.replace(/\/$/,''));
        if(i>=0&&l[i].x==='folder')cwd.path.push(i);else print('cd: không tìm thấy thư mục: '+rest,'er');
        break}
      case 'cat':{const l=cur();if(!l){print('cat: hãy vào một thư mục trước','er');break}const i=find(l,rest);if(i<0)print('cat: không tìm thấy: '+rest,'er');else if(l[i].x==='folder')print('cat: '+rest+': là một thư mục','er');else if(l[i].x==='md')print('# '+l[i].n.replace(/\.md$/,'')+'\nNội dung mẫu của tệp văn bản này.');else print('cat: '+rest+': tệp nhị phân','er');break}
      case 'mkdir':{if(!cwd.root){print('mkdir: không thể tạo ở thư mục gốc','er');break}if(!rest){print('mkdir: thiếu tên thư mục','er');break}const l=cur();if(find(l,rest)>=0){print('mkdir: đã tồn tại: '+rest,'er');break}l.push({n:rest,d:tstamp(),s:'--',x:'folder',items:[]});saveFS();break}
      case 'touch':{if(!cwd.root){print('touch: không thể tạo ở thư mục gốc','er');break}if(!rest){print('touch: thiếu tên tệp','er');break}const l=cur();if(find(l,rest)<0){const x=(rest.split('.').pop()||'md').toLowerCase();l.push({n:rest,d:tstamp(),s:'0 KB',x:rest.indexOf('.')>0?x:'md'});saveFS()}break}
      case 'rm':{const l=cur();if(!l){print('rm: hãy vào một thư mục trước','er');break}const i=find(l,rest);if(i<0)print('rm: không tìm thấy: '+rest,'er');else{moveToTrash(cwd.root,cwd.path,i);print('Đã chuyển "'+rest+'" vào Thùng rác')}break}
      case 'echo':print(m[2]);break;
      case 'date':print(new Date().toLocaleString('vi-VN',{dateStyle:'full',timeStyle:'medium'}));break;
      case 'whoami':print(userName().toLowerCase().replace(/\s+/g,''));break;
      case 'hostname':print('desktop-mini.local');break;
      case 'uname':print('DesktopMini 26 (trình duyệt) '+(navigator.platform||''));break;
      case 'uptime':print('đã chạy '+Math.round(performance.now()/60000)+' phút');break;
      case 'history':print(hist.map((h,i)=>(i+1)+'  '+h).join('\n')||'(chưa có lệnh nào)');break;
      case 'clear':out.innerHTML='';break;
      case 'exit':w._closing=true;closeWin(w);break;
      case 'open':{
        if(!rest){print('open: thiếu tên ứng dụng','er');break}
        const id=Object.keys(APPS).find(k=>!APPS[k].hidden&&(norm(APPS[k].name)===norm(rest)||k===norm(rest)));
        if(id){openApp(id)}else print('open: không có ứng dụng "'+rest+'"','er');
        break}
      case 'neofetch':{
        const nv=navigator;
        print('   ✦        '+userName().toLowerCase().replace(/\s+/g,'')+'@desktop-mini\n  ✦ ✦       ----------------\n ✦ ✦ ✦      OS: Desktop Mini 26\n  ✦ ✦       Trình duyệt: '+(nv.platform||'?')+'\n   ✦        Màn hình: '+screen.width+'x'+screen.height+'\n            CPU: '+(nv.hardwareConcurrency||'?')+' lõi\n            Bộ nhớ: '+(nv.deviceMemory?nv.deviceMemory+' GB':'?')+'\n            Giao diện: '+(isDark()?'Tối':'Sáng'));
        break}
      default:print('zsh: không tìm thấy lệnh: '+cmd,'er');
    }
  }
  out.addEventListener('click',()=>{const i=$('.tin',out);if(i&&!getSelection().toString())i.focus()});
  print('Desktop Mini Terminal. Gõ "help" để xem các lệnh.');
  prompt();
  live(w,'fs',()=>{});
  return {};
}

/* ---------- Đồng hồ ---------- */
function buildClock(b,w){
  const CITIES=[['Hà Nội','Asia/Ho_Chi_Minh']];
  b.innerHTML='<div class="app clk2"><div class="bar"><div class="nv seg3"><button data-k="world">Giờ thế giới</button><button data-k="sw">Bấm giờ</button><button data-k="tm">Hẹn giờ</button></div></div><div class="cbody"></div></div>';
  const body=$('.cbody',b); let tab='world', timers=[];
  const stop=()=>{timers.forEach(clearInterval);timers=[]};
  function face(i){return '<svg class="af" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--field)" stroke="var(--line)"/>'+[...Array(12)].map((_,k)=>'<line x1="50" y1="8" x2="50" y2="'+(k%3?12:15)+'" stroke="var(--muted)" stroke-width="'+(k%3?1:2)+'" transform="rotate('+k*30+' 50 50)"/>').join('')+'<line class="hh" x1="50" y1="50" x2="50" y2="28" stroke="var(--fg)" stroke-width="3.2" stroke-linecap="round"/><line class="mh" x1="50" y1="50" x2="50" y2="17" stroke="var(--fg)" stroke-width="2.4" stroke-linecap="round"/><line class="sh" x1="50" y1="56" x2="50" y2="12" stroke="#ff9f0a" stroke-width="1.2" stroke-linecap="round"/><circle cx="50" cy="50" r="2.4" fill="#ff9f0a"/></svg>'}
  function parts(tz){
    const f=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    const o={}; f.formatToParts(new Date()).forEach(p=>{o[p.type]=+p.value}); if(o.hour===24)o.hour=0; return o;
  }
  const ymd=tz=>new Date().toLocaleDateString('en-CA',{timeZone:tz});
  function worldTick(){
    $$('.wc',body).forEach(c=>{
      const tz=c.dataset.tz, p=parts(tz);
      $('.hh',c).setAttribute('transform','rotate('+((p.hour%12)*30+p.minute*.5)+' 50 50)');
      $('.mh',c).setAttribute('transform','rotate('+(p.minute*6+p.second*.1)+' 50 50)');
      $('.sh',c).setAttribute('transform','rotate('+p.second*6+' 50 50)');
      $('.wt',c).textContent=pad(p.hour)+':'+pad(p.minute);
      const a=ymd(tz), l=ymd(Intl.DateTimeFormat().resolvedOptions().timeZone);
      $('.wd',c).textContent=a===l?'Hôm nay':(a<l?'Hôm qua':'Ngày mai');
    });
  }
  function show(){
    stop();
    $$('.seg3 button',b).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.k===tab)));
    if(tab==='world'){
      body.innerHTML='<div class="wgrid">'+CITIES.map(c=>'<div class="wc" data-tz="'+c[1]+'">'+face()+'<b>'+c[0]+'</b><span class="wt"></span><small class="wd"></small></div>').join('')+'</div>';
      worldTick(); timers.push(setInterval(worldTick,1000));
    }else if(tab==='sw'){
      let run=false, t0=0, el=0, laps=[];
      body.innerHTML='<div class="swb"><div class="big sd">00:00.00</div><div class="swc"><button class="btn lp2">Vòng</button><button class="btn pri st">Bắt đầu</button></div><ol class="laps"></ol></div>';
      const sd=$('.sd',body), st=$('.st',body), lp=$('.lp2',body), ol=$('.laps',body);
      const f=ms=>{const c=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return pad(m)+':'+pad(s)+'.'+pad(c)};
      const upd=()=>{sd.textContent=f(run?el+(performance.now()-t0):el)};
      st.addEventListener('click',()=>{if(run){el+=performance.now()-t0;run=false;st.textContent='Tiếp tục';lp.textContent='Đặt lại'}else{t0=performance.now();run=true;st.textContent='Dừng';lp.textContent='Vòng'}upd()});
      lp.addEventListener('click',()=>{
        if(run){laps.unshift(f(el+performance.now()-t0))}else{el=0;laps=[];st.textContent='Bắt đầu';lp.textContent='Vòng'}
        ol.innerHTML=laps.map((x,i)=>'<li><span>Vòng '+(laps.length-i)+'</span><span>'+x+'</span></li>').join(''); upd();
      });
      timers.push(setInterval(upd,47));
    }else{
      const NA2=()=>window.AndroidLauncher||null;
      let AL=jget('dm-alarms',[]), SND=[{name:'Mặc định',uri:''}], sel=0, rep=false;
      try{const n=NA2();if(n&&n.getAlarmSounds){const l=JSON.parse(n.getAlarmSounds());if(l.length)SND=l}}catch(x){}
      const now0=new Date(); let hh=now0.getHours(), mm=(now0.getMinutes()+1)%60; if(mm===0)hh=(hh+1)%24;
      const saveAL=()=>jset('dm-alarms',AL);
      body.innerHTML='<div class="alm"><div class="whl"><div class="wcol" data-w="h" role="listbox" aria-label="Chọn giờ"></div><b class="wsep">:</b><div class="wcol" data-w="m" role="listbox" aria-label="Chọn phút"></div><i class="wband"></i></div>'+
        '<div class="alr"><span>Lặp lại hằng ngày</span>'+tgl(false,'','Lặp lại hằng ngày')+'</div>'+
        '<div class="als"><b>Âm thanh báo thức</b><ul class="snl"></ul></div>'+
        '<button class="btn pri aset" type="button">Đặt báo thức</button>'+
        '<div class="als"><b>Báo thức đã đặt</b><ul class="all"></ul></div></div>';
      const cols={h:$('[data-w="h"]',body), m:$('[data-w="m"]',body)};
      const IH=40;
      const fillCol=(c,max)=>{c.innerHTML=[...Array(max)].map((_,i)=>'<div class="wi" data-v="'+i+'">'+pad(i)+'</div>').join('')};
      fillCol(cols.h,24); fillCol(cols.m,60);
      const setCol=(c,v)=>{c.scrollTop=v*IH};
      const getCol=c=>Math.max(0,Math.round(c.scrollTop/IH));
      requestAnimationFrame(()=>{setCol(cols.h,hh);setCol(cols.m,mm)});
      ['h','m'].forEach(k=>{
        const c=cols[k]; let t=null;
        c.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{const v=getCol(c);if(k==='h')hh=Math.min(23,v);else mm=Math.min(59,v);$$('.wi',c).forEach(x=>x.classList.toggle('on',+x.dataset.v===v))},80)});
        c.addEventListener('click',e=>{const x=e.target.closest('.wi');if(x)c.scrollTo({top:+x.dataset.v*IH,behavior:'smooth'})});
      });
      setTimeout(()=>{$$('.wi',cols.h)[hh]&&$$('.wi',cols.h)[hh].classList.add('on');$$('.wi',cols.m)[mm]&&$$('.wi',cols.m)[mm].classList.add('on')},60);
      const rtg=$('.alr .tg',body);
      rtg.addEventListener('click',()=>{rep=!rep;rtg.setAttribute('aria-checked',String(rep))});
      const snl=$('.snl',body);
      const drawSnd=()=>{snl.innerHTML=SND.map((x,i)=>'<li data-i="'+i+'" aria-selected="'+(i===sel)+'"><span class="rd"></span><span class="sn">'+esc(x.name)+'</span><button type="button" class="apv" data-p="'+i+'" aria-label="Nghe thử">▶</button></li>').join('')};
      drawSnd();
      snl.addEventListener('click',e=>{
        const pv=e.target.closest('.apv');
        if(pv){const n=NA2();const u=SND[+pv.dataset.p].uri;if(n&&n.previewSound)n.previewSound(u);else beep();return}
        const li=e.target.closest('li[data-i]'); if(li){sel=+li.dataset.i;drawSnd()}
      });
      const all=$('.all',body);
      const drawAL=()=>{
        all.innerHTML=AL.length?AL.slice().sort((p,q)=>p.h*60+p.m-(q.h*60+q.m)).map(x=>'<li data-id="'+x.id+'"><span class="at">'+pad(x.h)+':'+pad(x.m)+'<small>'+(x.rep?'Hằng ngày':'Một lần')+' · '+esc(x.name)+'</small></span>'+tgl(x.on,'','Bật tắt báo thức')+'<button type="button" class="adl" aria-label="Xóa báo thức"><svg viewBox="0 0 14 14" width="12" height="12" aria-hidden="true"><path d="M2 2L12 12M12 2L2 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></li>').join(''):'<li class="non">Chưa có báo thức nào</li>';
      };
      drawAL();
      const arm=x=>{const n=NA2();if(n&&n.setAlarm){const ok=n.setAlarm(x.id,x.h,x.m,x.uri||'',!!x.rep,'');if(!ok){let why='';try{why=(n.getAlarmError&&n.getAlarmError())||''}catch(e){}notify({app:'Đồng hồ',title:'Không đặt được báo thức',body:why?('Lỗi: '+why):'Hãy cấp quyền thông báo cho ứng dụng rồi thử lại.',icon:'clock'})}return !!ok}return true};
      const disarm=x=>{const n=NA2();if(n&&n.cancelAlarm)n.cancelAlarm(x.id)};
      $('.aset',body).addEventListener('click',()=>{
        const x={id:(Date.now()%2000000000)|0,h:hh,m:mm,uri:SND[sel].uri,name:SND[sel].name,rep:rep,on:true};
        if(arm(x)){AL.push(x); saveAL(); drawAL();
          notify({app:'Đồng hồ',title:'Đã đặt báo thức '+pad(hh)+':'+pad(mm),body:SND[sel].name,icon:'clock'})}
      });
      all.addEventListener('click',e=>{
        const li=e.target.closest('li[data-id]'); if(!li)return;
        const x=AL.find(q=>String(q.id)===li.dataset.id); if(!x)return;
        if(e.target.closest('.adl')){disarm(x);AL=AL.filter(q=>q!==x);saveAL();drawAL();return}
        if(e.target.closest('.tg')){x.on=!x.on;saveAL();if(x.on)arm(x);else disarm(x);drawAL()}
      });
      /* Bản chạy trên trình duyệt (không có app Android): báo bằng âm bíp khi đúng giờ */
      timers.push(setInterval(()=>{
        if(NA2()&&NA2().setAlarm)return;
        const d=new Date(); if(d.getSeconds()!==0)return;
        AL.forEach(x=>{if(x.on&&x.h===d.getHours()&&x.m===d.getMinutes()){beep();notify({app:'Đồng hồ',title:'Báo thức '+pad(x.h)+':'+pad(x.m),body:x.name,icon:'clock'});if(!x.rep){x.on=false;saveAL()}}});
      },1000));
    }
  }
  $$('.seg3 button',b).forEach(x=>x.addEventListener('click',()=>{tab=x.dataset.k;show()}));
  show();
  return {destroy:stop};
}

const sq=$('#sq'), sres=$('#sres'); let sel=0, hits=[];
function calcExpr(t){
  if(!/^[\d\s+\-*/().,%x×÷]+$/.test(t)||!/[+\-*/%x×÷]/.test(t)||!/\d/.test(t))return null;
  try{
    const e=t.replace(/,/g,'.').replace(/[x×]/g,'*').replace(/÷/g,'/').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
    const r=Function('"use strict";return ('+e+')')();
    return (typeof r==='number'&&isFinite(r))?String(+r.toPrecision(12)).replace('.',','):null;
  }catch(e){return null}
}
function openAny(it,ref){
  if(it.x==='folder'&&ref){openApp('files',{root:ref.root,path:ref.path.concat(ref.idx)});return}
  if(it.x==='jpg'||it.x==='png'){openApp('photos',{file:it.n});return}
  if(it.x==='mp3'){openApp('music',{play:true});return}
  if(it.x==='md'){openApp('notes',{file:it.n});return}
  quickLook(it);
}
function renderSpot(){
  const raw=sq.value.trim(), term=norm(raw); hits=[]; sel=0; sres.innerHTML='';
  if(term){
    const c=calcExpr(raw); if(c)hits.push({ic:'calc',t:'= '+c,s:'Máy tính',fn:()=>{try{navigator.clipboard.writeText(c)}catch(e){}openApp('calc')}});
    LP_APPS.forEach(id=>{if(norm(APPS[id].name).indexOf(term)>=0)hits.push({ic:id,t:APPS[id].name,s:'Ứng dụng',fn:()=>openApp(id)})});
    hits=hits.slice(0,8);
  }
  hits.forEach((h,i)=>{
    const r=document.createElement('button'); r.className='sr'; r.setAttribute('aria-selected',String(i===sel));
    r.innerHTML=iconHTML(h.ic)+'<span>'+esc(h.t)+'</span><small>'+esc(h.s)+'</small>';
    r.addEventListener('click',()=>{closeAllPopups();h.fn()});
    sres.appendChild(r);
  });
  if(term&&!hits.length)sres.innerHTML='<div class="sr nores">Không có kết quả</div>';
}
function openSpot(){closeAllPopups();if(lpOn)closeLP();pops.spot.hidden=false;sq.value='';renderSpot();setTimeout(()=>sq.focus(),0)}
$('#srch').addEventListener('click',e=>{e.stopPropagation();if(pops.spot.hidden)openSpot();else closeAllPopups()});
sq.addEventListener('input',renderSpot);
sq.addEventListener('keydown',e=>{
  const mark=()=>$$('.sr',sres).forEach((r,i)=>r.setAttribute('aria-selected',String(i===sel)));
  if(e.key==='ArrowDown'&&hits.length){sel=(sel+1)%hits.length;mark();e.preventDefault()}
  else if(e.key==='ArrowUp'&&hits.length){sel=(sel-1+hits.length)%hits.length;mark();e.preventDefault()}
  else if(e.key==='Enter'&&hits.length){const h=hits[sel];closeAllPopups();h.fn()}
});

let mcLabels=[];
function enterMC(){
  closeAllPopups(); if(lpOn)closeLP();
  const ws=$$('.win',layer).filter(w=>!w.classList.contains('min')&&!w._leaving);
  mcOn=true; $('#mcx').hidden=false; stage.classList.remove('mcx'); stage.classList.add('mc');
  $('#mcbg').innerHTML='<div class="mcsp"><span>Desktop 1</span></div>'+(ws.length?'':'<div class="mcnone">Không có cửa sổ nào đang mở</div>');
  const sr=stage.getBoundingClientRect(), base=parseFloat(getComputedStyle(stage).getPropertyValue('--base'))||54;
  const x0=24, y0=84, W=sr.width-48, H=sr.height-y0-(base+44), gap=22, n=ws.length||1;
  const cols=Math.ceil(Math.sqrt(n*W/Math.max(H,1))), rows=Math.ceil(n/cols);
  const cw=(W-(cols-1)*gap)/cols, ch=(H-(rows-1)*gap-rows*20)/rows;
  mcLabels.forEach(l=>l.remove()); mcLabels=[];
  ws.forEach((w,i)=>{
    const c=i%cols, r=Math.floor(i/cols);
    const s=Math.min(cw/w.offsetWidth,ch/w.offsetHeight,.85);
    const tx=x0+c*(cw+gap)+(cw-w.offsetWidth*s)/2, ty=y0+r*(ch+gap+20)+(ch-w.offsetHeight*s)/2;
    w.style.transformOrigin='0 0';
    w.style.transform='translate('+(tx-w.offsetLeft)+'px,'+(ty-w.offsetTop)+'px) scale('+s+')';
    const l=document.createElement('div'); l.className='mcl'; l.textContent=APPS[w.dataset.app].name;
    l.style.left=tx+'px'; l.style.top=(ty+w.offsetHeight*s+6)+'px'; l.style.width=(w.offsetWidth*s)+'px';
    layer.appendChild(l); mcLabels.push(l);
  });
}
function exitMC(pick){
  if(!mcOn)return; mcOn=false; $('#mcx').hidden=true;
  $$('.win',layer).forEach(w=>{w.style.transform=''});
  mcLabels.forEach(l=>l.remove()); mcLabels=[];
  stage.classList.add('mcx'); stage.classList.remove('mc');
  if(pick&&wins[pick.dataset.app])focusWin(pick);
  setTimeout(()=>{if(!mcOn)stage.classList.remove('mcx')},reduce?0:380);
}
layer.addEventListener('click',e=>{

},true);

/* --- Mật khẩu màn hình thật: ký tự (ngang), PIN hoặc hình vẽ (dọc) --- */
const sha256=(()=>{
  const K=[],H0=[]; let n=2,c=0; const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
  while(c<64){if(isP(n)){if(c<8)H0.push((Math.pow(n,.5)%1)*4294967296|0);K.push((Math.pow(n,1/3)%1)*4294967296|0);c++}n++}
  const rr=(x,k)=>(x>>>k)|(x<<(32-k));
  return str=>{
    const b=unescape(encodeURIComponent(str)), l=b.length, w=[];
    for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
    w[l>>2]|=0x80<<(24-(l%4)*8);
    const len=(((l+8)>>6)+1)*16; for(let i=0;i<len;i++)if(w[i]===undefined)w[i]=0; w[len-1]=l*8;
    let h=H0.slice();
    for(let o=0;o<len;o+=16){
      const m=w.slice(o,o+16);
      for(let i=16;i<64;i++){const x=m[i-15],y=m[i-2];m[i]=(m[i-16]+(rr(x,7)^rr(x,18)^(x>>>3))+m[i-7]+(rr(y,17)^rr(y,19)^(y>>>10)))|0}
      let [a,b2,c2,d,e,f,g,hh]=h;
      for(let i=0;i<64;i++){
        const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+m[i])|0, t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b2)^(a&c2)^(b2&c2)))|0;
        hh=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b2;b2=a;a=(t1+t2)|0;
      }
      h=[h[0]+a|0,h[1]+b2|0,h[2]+c2|0,h[3]+d|0,h[4]+e|0,h[5]+f|0,h[6]+g|0,h[7]+hh|0];
    }
    return h.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
  };
})();
const LK='dm-lock', lk=()=>jget(LK,{});
const hasLock=()=>{const o=lk();return !!(o.pw||o.pin||o.pat)};
const lkHash=(k,v)=>{let o=lk();if(!o.s){o.s=Math.random().toString(36).slice(2)+Date.now().toString(36);jset(LK,o)}return sha256(lk().s+'|'+k+'|'+v)};
const lkSet=(k,v)=>{const h=lkHash(k,v),o=lk();o[k]=h;if(k==='pin')o.pl=v.length;jset(LK,o)};
const lkDel=k=>{const o=lk();delete o[k];if(k==='pin')delete o.pl;jset(LK,o)};
const lkChk=(k,v)=>lk()[k]===lkHash(k,v);
const isPortrait=()=>window.innerHeight>=window.innerWidth;
/* Ngang -> mật khẩu ký tự; dọc -> PIN hoặc hình vẽ theo lựa chọn. Nếu kiểu cần chưa đặt thì dùng kiểu đã đặt, không để lọt khóa. */

    const dots=$('.adots',bd);
    const draw=()=>{const n=Math.max(o.len||4,v.length);dots.innerHTML=[...Array(n)].map((_,i)=>'<i'+(i<v.length?' class="f"':'')+'></i>').join('')};
    const send=()=>{const x=v; if(!submit(x)){v='';draw()}};
    draw();
    bd.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b)return;

      else if(b.dataset.a==='ok'){if(v.length>=4)send();else fail('Tối thiểu 4 số')}
    });
  }else{
    const P=[...Array(9)].map((_,i)=>[20+40*(i%3),20+40*Math.floor(i/3)]);
    bd.innerHTML='<div class="apat"><svg viewBox="0 0 120 120"><polyline fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>'+P.map((p,i)=>'<circle data-i="'+i+'" cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="currentColor" opacity=".55"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="12" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"/>').join('')+'</svg></div>';
    const svg=$('svg',bd), pl=$('polyline',bd); let seq=[], drag=false, busy=false;

  function loadPhotos(){
    const l=safe(()=>JSON.parse(A.getPhotos()),[]);
    PH.length=0; l.forEach(p=>{const e=['','','','','',p.n];e.pid=p.id;
      /* Phân loại theo thư mục/tên tệp: ảnh chụp màn hình (Screenshots) và ảnh chụp bằng camera (DCIM/Camera, Pictures/Desktop Mini) */
      const lp=((p.p||'')+' '+(p.n||'')).toLowerCase();
      if(/screenshot|screen_shot|screen-shot|chụp màn hình|chup man hinh/.test(lp))e.k='shot';
      else if(/dcim\/camera|dcim\/100|desktop mini|desktopmini/.test(lp)||/^(img|pxl)_\d{8}_\d{6}/.test((p.n||'').toLowerCase()))e.k='cam';
      PH.push(e)});
  }
  loadPhotos();
  const q=[]; let run=false;
  function pump(){
    if(run)return; run=true;
    (function next(){
      const img=q.shift(); if(!img){run=false;return}
      if(!img.isConnected||img.src){next();return}
      const big=!!img.closest('.pv');
      setTimeout(()=>{const d=safe(()=>A.getPhotoData(+img.dataset.pid,big?1080:260),'');if(d)img.src=d;next()},0);
    })();
  }
  new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{
    if(n.nodeType!==1)return;
    (n.matches&&n.matches('img.rp')?[n]:[...n.querySelectorAll('img.rp')]).forEach(i=>{if(big_ok(i))q.push(i)});
  }));pump()}).observe(document.body,{childList:true,subtree:true});
  function big_ok(i){return !i.getAttribute('src')}
  window.nativeReload=function(){loadTracks();loadPhotos();sync();realBatt();insets();if(window.devCalReset)devCalReset()};
  /* Thư = Gmail trong cửa sổ */
  APPS.mail.name='Gmail'; const mb=dockBtn('mail'); if(mb){mb.dataset.label='Gmail';mb.setAttribute('aria-label','Gmail')}
  /* Giới thiệu: thông tin máy thật */
  const inf=safe(()=>JSON.parse(A.getInfo()),{});
  if(inf.model){window.NATIVE_INFO=inf}
})()}

})();
</script>
