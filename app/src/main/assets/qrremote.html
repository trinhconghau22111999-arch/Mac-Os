<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Remote Input</title>
<style>
  html,body{margin:0;min-height:100%;background:#1a1030;color:#eee;font-family:Roboto,Arial,sans-serif;}
  .card{max-width:420px;margin:0 auto;padding:18px;display:flex;flex-direction:column;align-items:center;}
  h2{font-size:18px;margin:8px 0 14px;}
  #qrBox{background:#fff;padding:10px;border-radius:12px;}
  #qrCanvas{display:block;}
  #qrLink{margin-top:12px;font-size:12px;color:#c9a8ff;word-break:break-all;text-align:center;}
  #status{margin-top:12px;font-size:14px;color:#9ada9a;min-height:20px;text-align:center;}
  .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center;}
  button{padding:10px 16px;border-radius:20px;border:none;background:linear-gradient(135deg,#8b2dff,#c026ff);color:#fff;font-size:14px;font-weight:600;}
  button.secondary{background:#3b2b66;}
  .hint{margin-top:18px;font-size:13px;line-height:1.5;color:#bbb;text-align:center;}
</style>
</head>
<body>
<div class="card">
  <h2>QR Remote Input</h2>
  <div id="qrBox"><canvas id="qrCanvas"></canvas></div>
  <div id="qrLink"></div>
  <div id="status">Đang tạo phiên...</div>
  <div class="row">
    <button id="newBtn">Phiên mới</button>
    <button id="copyBtn" class="secondary">Sao chép link</button>
    <button id="closeBtn" class="secondary">Đóng khung này</button>
  </div>
  <div class="hint">
    Dùng một điện thoại khác quét mã QR này, rồi ngắm camera vào mã QR/mã vạch cần nhập.<br>
    Nội dung quét được sẽ được gõ vào <b>ô đang chọn</b> trong tab trình duyệt hiện tại.
    Bấm "Đóng khung này" (phiên vẫn chạy ngầm), chạm vào ô cần nhập rồi quét.
  </div>
</div>

<script src="vendor/firebase-compat.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script>
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyCPwMKElbsQLjOeSVddGAfjNiHnPHV9b1A",
    authDomain: "qrremod.firebaseapp.com",
    databaseURL: "https://qrremod-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "qrremod",
    storageBucket: "qrremod.firebasestorage.app",
    messagingSenderId: "949360436062",
    appId: "1:949360436062:web:c9b5b5d47ee4f76fdce5cf"
  };
  // Trang quet QR tren dien thoai (cung trang voi ban may tinh).
  var MOBILE_SCAN_URL = "https://trinhconghau22111999-arch.github.io/Qrtuxa/";

  var statusEl = document.getElementById('status');
  var db = null, sessionRef = null, currentSession = null, lastTs = 0, currentLink = '';

  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
  } catch (e) {
    statusEl.textContent = 'Lỗi Firebase: ' + e.message;
  }

  function genSessionId() {
    return 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
  }

  function stopSession() {
    if (sessionRef) {
      try { sessionRef.child('data').off(); sessionRef.remove().catch(function(){}); } catch (e) {}
    }
    sessionRef = null; currentSession = null; lastTs = 0;
  }

  function startSession() {
    if (!db) { statusEl.textContent = 'Firebase chưa khởi tạo được (kiểm tra mạng).'; return; }
    stopSession();
    currentSession = genSessionId();
    currentLink = MOBILE_SCAN_URL + '?session=' + currentSession;
    QRCode.toCanvas(document.getElementById('qrCanvas'), currentLink, { width: 250, margin: 1 }, function (err) {
      if (err) statusEl.textContent = 'Lỗi vẽ QR: ' + err.message;
    });
    document.getElementById('qrLink').textContent = currentLink;
    statusEl.textContent = 'Đang chờ dữ liệu quét...';

    sessionRef = db.ref('sessions/' + currentSession);
    sessionRef.set({ createdAt: firebase.database.ServerValue.TIMESTAMP })
      .catch(function (e) { statusEl.textContent = 'Lỗi ghi Firebase: ' + e.message; });

    sessionRef.child('data').on('value', function (snap) {
      var val = snap.val();
      if (!val || !val.text) return;
      if (val.ts && val.ts === lastTs) return;
      lastTs = val.ts || Date.now();
      statusEl.textContent = 'Đã nhận: ' + String(val.text).replace(/[^\p{L}\p{N}_\s]/gu, '').slice(0, 40);
      if (window.Android && Android.onText) Android.onText(String(val.text));
    }, function (err) {
      statusEl.textContent = 'Lỗi lắng nghe Firebase: ' + err.message;
    });
  }

  document.getElementById('newBtn').onclick = startSession;
  document.getElementById('closeBtn').onclick = function () { if (window.Android) Android.close(); };
  document.getElementById('copyBtn').onclick = function () {
    if (window.Android && Android.copy) { Android.copy(currentLink); statusEl.textContent = 'Đã sao chép link.'; }
  };
  startSession();
</script>
</body>
</html>
