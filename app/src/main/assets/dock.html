<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
body{position:relative;--base:46px;--ics:calc(var(--barh,calc(var(--base) + 18px)) - var(--pad,0px) - 12px);--ic:var(--ics)}
/* Thanh chữ nhật dài, MỘT nền duy nhất, bám đáy cửa sổ; phần trong suốt phía trên chỉ xuất hiện lúc phóng đại icon */
.pill{position:absolute;left:0;right:0;bottom:0;height:var(--barh,calc(var(--base) + 18px));display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px var(--pad,0px);background:#111113;box-shadow:0 1px 0 rgba(255,255,255,.16) inset}
.sb{flex:none;width:var(--ics);height:var(--ics);border:0;background:none;color:#fff;display:grid;place-items:center;padding:0}
.sb:active{transform:scale(.9);opacity:.7}
.sb svg{width:72%;height:72%}
.sep{display:none}
.sc{flex:1 1 auto;min-width:0;height:100%;display:flex;align-items:center;overflow:visible}
.sc.scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sc.scroll::-webkit-scrollbar{display:none}
.sc.scroll .apps{margin:0;justify-content:flex-start;padding:0 4px}
.apps{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto}
.dk{flex:none;width:var(--ic);height:var(--ic);border:0;background:none;padding:0;position:relative;-webkit-touch-callout:none}
.pill{touch-action:none}
.dk.lift{z-index:3}
.dk.lift .ic{transform:scale(1.14);filter:brightness(1.12);box-shadow:0 8px 16px rgba(0,0,0,.55)}
.dk.ext .ic{background:rgba(255,255,255,.12)}
.dk.ext .ic img{width:100%;height:100%;object-fit:cover;display:block}
.sp{flex:none;width:1px;height:60%;background:rgba(255,255,255,.28);margin:0 2px}
@keyframes bnc{0%{transform:translateY(0)}35%{transform:translateY(-34%)}60%{transform:translateY(0)}78%{transform:translateY(-12%)}100%{transform:translateY(0)}}
.dk.bn .ic{animation:bnc .5s ease-out}
.dk:active .ic{filter:brightness(.8)}
.dk.run::after{content:"";position:absolute;left:50%;bottom:-5px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:rgba(255,255,255,.85)}
.ic{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:22.5%;overflow:hidden;container-type:inline-size;transform-origin:50% 100%;will-change:transform;box-shadow:0 0 0 .5px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.28)}
body[data-ics="circle"] .ic{border-radius:50%}
body[data-ics="square"] .ic{border-radius:10%}
.ic::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0) 46%);pointer-events:none}
.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);pointer-events:none}
.ic svg{width:60%;height:60%}
.cic{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;color:#1d1d1f}
.cic b{background:#ff3b30;color:#fff;text-align:center;font-size:15cqw;line-height:1;padding:9cqw 0 6cqw;letter-spacing:.04em}
.cic span{flex:1;display:grid;place-items:center;font-size:48cqw;font-weight:300;line-height:1}
</style></head>
<body>
<div class="pill" id="pill">
  <button class="sb" id="ai" type="button" aria-label="AI giọng nói"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.5 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0h-2a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 17.5 12zM19 1.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg></button>
  <span class="sep"></span>
  <div class="sc" id="sc"><div class="apps" id="apps"></div></div>
  <span class="sep" id="sep2"></span>
  <button class="sb" id="shot" type="button" aria-label="Chụp ảnh màn hình"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/></svg></button>
</div>
<script>
var apps=document.getElementById('apps'),shot=document.getElementById('shot'),sep2=document.getElementById('sep2'),pill=document.getElementById('pill');

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function B(){return parseFloat(getComputedStyle(document.body).getPropertyValue('--base'))||46}
window.setLayout=function(h,pad){var st=document.body.style;st.setProperty('--barh',h+'px');st.setProperty('--pad',pad+'px')};
window.setBase=function(b){document.body.style.setProperty('--base',b+'px')};
window.setIcs=function(v){document.body.setAttribute('data-ics',v||'round')};
var lastList=[],lastExt=[];
function ico(a){return '<button class="dk'+(a.r?' run':'')+'" type="button" data-p="'+(a.p===0?0:1)+'" data-id="'+esc(a.id)+'" aria-label="'+esc(a.name)+'"><span class="ic" style="background:'+a.bg+'">'+a.g+'</span></button>'}
function ico2(a){return '<button class="dk ext run" type="button" data-pk="'+esc(a.p)+'" aria-label="'+esc(a.n)+'"><span class="ic"><img alt="" src="'+a.u+'"></span></button>'}
var PD=null,dragging=false,pend=false,noClickUntil=0,lastPT='mouse',menuAt=0;
function busy(){return dragging||(PD&&Date.now()-PD.t<6000)}
function flush(){if(pend&&!busy()){pend=false;render()}}
function render(){
  if(busy()){pend=true;return}
  try{
    apps.innerHTML=lastList.map(ico).join('')+(lastExt.length&&lastList.length?'<span class="sp"></span>':'')+lastExt.map(ico2).join('');
  }catch(e){}
  fitIcons();
}
window.setDock=function(list){lastList=list||[];render()};
/* App ngoài đang/đã mở (Zalo, Chrome...): hiện icon thật của app ngay sau các icon Dock, có chấm bên dưới */
window.setExt=function(list){lastExt=list||[];render()};
/* Hình nền liền với Desktop: nền Dock là lát phía dưới của chính hình nền (u = data URL, h = cao CSS px của lát). Cửa sổ Dock full chiều ngang nên lát rộng 100% là khớp màn hình.
   Chỉ phủ lớp tối rất nhẹ tăng dần về đáy (mép trên = 0) và bỏ viền sáng, để không lộ đường ranh với Desktop. */
window.setWall=function(u,h){
  if(!u){pill.style.background='';pill.style.boxShadow='';return}
  pill.style.boxShadow='none';
  pill.style.background='linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.16)),url("'+u+'") left bottom/100% '+h+'px no-repeat';
};
window.setShot=function(on){shot.style.display=on?'':'none'};
/* Không còn phóng đại khi rê/lướt: bấm icon thì nảy lên một nhịp rồi mở đúng app đó. Cửa sổ Dock luôn giữ nguyên kích thước. */
window.setMag=function(){};
function fitIcons(){
  var n=apps.children.length; if(!n){return}
  var sc=document.getElementById('sc'); var avail=sc.clientWidth||0; if(avail<=0)return;
  var st=document.body.style; st.removeProperty('--ic'); apps.style.gap=''; sc.classList.remove('scroll');
  var full=parseFloat(getComputedStyle(apps.firstElementChild).width)||40, gap=10, seps=apps.querySelectorAll('.sp').length;
  var need=(n-seps)*full+(n-1)*gap+seps*4;
  if(need<=avail)return;
  /* Thu icon (tối thiểu 16px) và khe hẹp lại cho vừa chiều ngang, kể cả khi Dock dọc */
  var g=6, w=Math.max(16,Math.floor((avail-(n-1)*g-seps*4)/(n-seps)));
  st.setProperty('--ic',w+'px'); apps.style.gap=g+'px';
  need=(n-seps)*w+(n-1)*g+seps*4;
  /* Vẫn không vừa: cho vuốt ngang để icon dư vẫn chạm được, không bị cắt mất */
  if(need>avail) sc.classList.add('scroll');
}
window.addEventListener('resize',function(){setTimeout(fitIcons,50)});
/* rê/chạm vào Dock: báo cho dịch vụ giữ Dock hiện (khi bật tự ẩn) */
['pointerdown','pointermove'].forEach(function(t){pill.addEventListener(t,function(){try{DockApp.touch()}catch(x){}},{passive:true})});
/* Chỗ trống trên Dock (không trúng icon/nút):
   - BÊN TRÁI icon (giữa nút AI và icon): mỗi lần chạm = Back ngay (không có chạm đôi; chạm lần 2 = Back thêm lần nữa)
   - BÊN PHẢI icon (giữa icon và nút chụp màn hình): chạm 1 lần = về Desktop, chạm 2 lần = mở đa nhiệm */
var tapDn=null,lastTap=null;
function tapSide(x){var r=apps.getBoundingClientRect();return x<r.left+r.width/2?'L':'R'}
pill.addEventListener('pointerdown',function(e){tapDn=e.target.closest('.dk,.sb')?null:{x:e.clientX,y:e.clientY,t:Date.now()}});
pill.addEventListener('pointerup',function(e){
  var d=tapDn;tapDn=null;if(!d)return;var now=Date.now();
  if(now-d.t>350||Math.abs(e.clientX-d.x)>14||Math.abs(e.clientY-d.y)>14){lastTap=null;return}
  if(tapSide(e.clientX)==='L'){lastTap=null;try{DockApp.back()}catch(x){}return}
  if(lastTap&&now-lastTap.t<450&&Math.abs(e.clientX-lastTap.x)<48&&Math.abs(e.clientY-lastTap.y)<48){lastTap=null;setTimeout(function(){try{DockApp.multitask()}catch(x){}},400);return} /* chờ các cửa sổ thu xong rồi mới mở đa nhiệm */
  lastTap={x:e.clientX,y:e.clientY,t:now};
  try{DockApp.home()}catch(x){} /* chạm 1 lần chỗ trống bên phải = về Desktop, thu hết các app đang mở xuống */
});
var shotT=0;
document.addEventListener('click',function(e){
  var d=e.target.closest('.dk');
  if(d&&Date.now()<noClickUntil){return}
  if(d){
    d.classList.remove('bn');void d.offsetWidth;d.classList.add('bn');
    var id=d.dataset.id,pk=d.dataset.pk;
    setTimeout(function(){d.classList.remove('bn');try{if(pk)DockApp.openExt(pk);else DockApp.open(id)}catch(x){}},230);
    return;
  }
  if(e.target.closest('#ai')){DockApp.ai();return}
  if(e.target.closest('#shot')){
    /* 1 lần bấm = chụp toàn màn hình; bấm 2 lần = kéo chọn vùng chụp */
    if(shotT){clearTimeout(shotT);shotT=0;try{DockApp.shotRegion()}catch(x){}return}
    shotT=setTimeout(function(){shotT=0;try{DockApp.shot()}catch(x){}},300);
  }
});

/* ===== Sắp xếp / xóa icon trên Dock =====
   Chuột: bấm giữ rồi kéo ngang; chuột phải = menu.  Cảm ứng: nhấn giữ rồi kéo ngang (nhả mà không kéo = menu).
   Thứ tự được gửi sang dịch vụ (DockApp.reorder) và lưu lại, khởi động lại vẫn giữ nguyên. */
function pinnedEls(){return Array.prototype.filter.call(apps.querySelectorAll('.dk[data-id]'),function(d){return d.dataset.p!=='0'})}
function showMenu(id){
  var el=apps.querySelector('.dk[data-id="'+id.replace(/"/g,'\\"')+'"]'); if(!el)return;
  var r=el.getBoundingClientRect(); menuAt=Date.now();
  try{DockApp.menu(id,el.getAttribute('aria-label')||id,r.left+r.width/2,el.dataset.p!=='0',el.classList.contains('run'))}catch(x){}
}
apps.addEventListener('pointerdown',function(e){
  lastPT=e.pointerType;
  var d=e.target.closest('.dk[data-id]'); if(!d)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var id=d.dataset.id, canDrag=d.dataset.p!=='0'&&id!=='launchpad';
  if(PD){clearTimeout(PD.tm)}
  var p=PD={el:d,id:id,pid:e.pointerId,x:e.clientX,y:e.clientY,t:Date.now(),armed:false,drag:false,mouse:e.pointerType==='mouse',canDrag:canDrag,tm:0,menuDone:false};
  if(!p.mouse){
    p.tm=setTimeout(function(){
      if(PD!==p||p.drag)return;
      if(canDrag){p.armed=true;d.classList.add('lift')}
      else{p.menuDone=true;showMenu(id)}
    },420);
  }
  try{d.setPointerCapture(e.pointerId)}catch(x){}
});
document.addEventListener('pointermove',function(e){
  var p=PD; if(!p||e.pointerId!==p.pid)return;
  var dx=e.clientX-p.x, dy=e.clientY-p.y;
  if(p.drag){moveDrag(p,e.clientX);return}
  if(p.mouse){if(p.canDrag&&Math.abs(dx)>6)startDrag(p);return}
  if(!p.armed){if(Math.abs(dx)+Math.abs(dy)>10){clearTimeout(p.tm);p.el.classList.remove('lift');PD=null;flush()}return}
  if(Math.abs(dx)>4)startDrag(p);
},{passive:true});
function startDrag(p){
  var els=pinnedEls(); if(els.length<2||dragging){PD=null;return}
  clearTimeout(p.tm); p.drag=true; dragging=true;
  p.els=els; p.from=els.indexOf(p.el);
  p.rects=els.map(function(x){var r=x.getBoundingClientRect();return{l:r.left,w:r.width}});
  p.step=p.rects.length>1?(p.rects[1].l-p.rects[0].l):(p.rects[0].w+10);
  p.minIdx=els[0].dataset.id==='launchpad'?1:0;
  p.to=p.from;
  p.el.classList.add('lift'); p.el.style.transition='none';
  els.forEach(function(x){if(x!==p.el)x.style.transition='transform .16s ease'});
}
function moveDrag(p,cx){
  var base=p.rects[p.from], minL=p.rects[p.minIdx].l, maxL=p.rects[p.rects.length-1].l;
  var left=Math.max(minL,Math.min(maxL,base.l+(cx-p.x)));
  p.el.style.transform='translateX('+(left-base.l)+'px)';
  var c=left+base.w/2, to=p.from, best=1e9;
  for(var k=p.minIdx;k<p.rects.length;k++){var d=Math.abs(p.rects[k].l+p.rects[k].w/2-c);if(d<best){best=d;to=k}}
  p.to=to;
  p.els.forEach(function(x,i){
    if(x===p.el)return;
    var s=0;
    if(p.from<p.to&&i>p.from&&i<=p.to)s=-p.step; else if(p.from>p.to&&i>=p.to&&i<p.from)s=p.step;
    x.style.transform=s?'translateX('+s+'px)':'';
  });
}
function finishDrag(p){
  var el=p.el, order=p.els.slice(); order.splice(p.from,1); order.splice(p.to,0,el);
  el.style.transition='transform .14s ease';
  el.style.transform='translateX('+(p.rects[p.to].l-p.rects[p.from].l)+'px)';
  setTimeout(function(){
    var anchor=p.els[p.els.length-1].nextSibling;
    p.els.forEach(function(x){x.style.transition='none';x.style.transform='';x.style.zIndex=''});
    el.classList.remove('lift');
    order.forEach(function(x){apps.insertBefore(x,anchor)});
    void apps.offsetWidth;
    p.els.forEach(function(x){x.style.transition=''});
    var ids=order.map(function(x){return x.dataset.id});
    if(p.to!==p.from){
      var m={},nl=[]; lastList.forEach(function(a){m[a.id]=a});
      ids.forEach(function(id){if(m[id])nl.push(m[id])});
      lastList.forEach(function(a){if(ids.indexOf(a.id)<0)nl.push(a)});
      lastList=nl;
      try{DockApp.reorder(JSON.stringify(ids))}catch(x){}
    }
    dragging=false; flush();
  },160);
}
function endPtr(e){
  var p=PD; if(!p||e.pointerId!==p.pid)return;
  clearTimeout(p.tm); PD=null;
  if(p.drag){noClickUntil=Date.now()+450;finishDrag(p);return}
  p.el.classList.remove('lift');
  if(p.menuDone){noClickUntil=Date.now()+450}
  else if(p.armed&&e.type==='pointerup'){noClickUntil=Date.now()+450;showMenu(p.id)}
  flush();
}
document.addEventListener('pointerup',endPtr);
document.addEventListener('pointercancel',endPtr);
/* chuột phải (hoặc phím menu) = menu; chạm giữ đã được xử lý riêng ở trên nên bỏ qua sự kiện contextmenu do cảm ứng sinh ra */
document.addEventListener('contextmenu',function(e){
  e.preventDefault();
  if(lastPT==='touch')return;
  var d=e.target.closest('.dk[data-id]'); if(!d||Date.now()-menuAt<500)return;
  if(PD){clearTimeout(PD.tm);PD=null}
  showMenu(d.dataset.id);
});
</script>

</body></html>
