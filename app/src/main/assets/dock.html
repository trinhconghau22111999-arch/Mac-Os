<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
.bar{height:100%;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:30px;background:rgba(36,38,46,.86);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 10px 30px rgba(0,0,0,.45);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;transform:translateY(40px);opacity:0;transition:transform .18s ease-out,opacity .18s}
.bar::-webkit-scrollbar{display:none}
.bar.in{transform:none;opacity:1}
.nv{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;border:0}
.nv:active{background:rgba(255,255,255,.34)}
.nv svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sep{flex:none;width:1px;height:42px;background:rgba(255,255,255,.22);margin:0 2px}
.dk{flex:none;width:56px;height:56px;border:0;background:none;padding:0}
.dk:active{transform:scale(.9)}
.ic{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:22.5%;overflow:hidden;container-type:inline-size;box-shadow:0 0 0 .5px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.28)}
.ic::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0) 46%);pointer-events:none}
.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);pointer-events:none}
.ic svg{width:60%;height:60%}
.cic{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;color:#1d1d1f}
.cic b{background:#ff3b30;color:#fff;text-align:center;font-size:15cqw;line-height:1;padding:9cqw 0 6cqw;letter-spacing:.04em}
.cic span{flex:1;display:grid;place-items:center;font-size:48cqw;font-weight:300;line-height:1}
</style></head>
<body>
<div class="bar" id="bar">
  <button class="nv" data-n="back" aria-label="Quay lại"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="nv" data-n="home" aria-label="Màn hình chính"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></button>
  <button class="nv" data-n="recents" aria-label="Ứng dụng gần đây"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></svg></button>
  <span class="sep"></span>
  <span id="apps" style="display:contents"></span>
</div>
<script>
var bar=document.getElementById('bar'),apps=document.getElementById('apps');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
window.setDock=function(list){
  try{
    apps.innerHTML=list.map(function(a){
      return '<button class="dk" data-id="'+esc(a.id)+'" aria-label="'+esc(a.name)+'"><span class="ic" style="background:'+a.bg+'">'+a.g+'</span></button>';
    }).join('');
  }catch(e){}
};
window.reveal=function(){bar.classList.remove('in');void bar.offsetWidth;bar.classList.add('in');bar.scrollLeft=0};
bar.addEventListener('click',function(e){
  var n=e.target.closest('[data-n]'); if(n){DockApp.nav(n.dataset.n);return}
  var d=e.target.closest('[data-id]'); if(d){DockApp.open(d.dataset.id)}
});
bar.addEventListener('scroll',function(){try{DockApp.keep()}catch(e){}});
</script>
</body></html>
