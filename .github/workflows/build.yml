name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU đóng gói, ngăn cách bằng dấu phẩy (arm64-v8a,x86_64,x86,armeabi-v7a)'
        default: 'arm64-v8a,x86_64,x86'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Giải mã khóa ký cố định
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - run: gradle assembleRelease --no-daemon -Pabis="${{ github.event.inputs.abis || 'arm64-v8a,x86_64,x86' }}"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Kiểm tra chữ ký
        run: |
          APKS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKS" verify --print-certs app/build/outputs/apk/release/*.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopMiniLauncher-apk
          path: app/build/outputs/apk/release/*.apk
