name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU đóng gói, ngăn cách bằng dấu phẩy (mặc định x86 = Lenovo Yoga Book YB1-X90F; máy khác: arm64-v8a,x86_64,x86,armeabi-v7a)'
        default: 'x86'
# Push liên tiếp trên cùng một nhánh: hủy bản build cũ đang chạy, chỉ build bản mới nhất (đỡ tốn phút Actions)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # để CI tự ghi file gecko.version (ghim phiên bản GeckoView) ở lần build đầu tiên
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Giải mã khóa ký cố định
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon -Pabis="${{ github.event.inputs.abis || 'x86' }}" 2>&1 | tee build.log || {
            # Đưa lỗi biên dịch lên phần Annotations của lần chạy để đọc nhanh, không cần mở log dài
            grep -E "^e: |error:|Caused by|Missing class|R8: |ERROR:|What went wrong|Execution failed|Could not |Unresolved" -A3 build.log | cut -c1-400 | head -80 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Kiểm tra chữ ký
        run: |
          APKS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKS" verify --print-certs app/build/outputs/apk/release/*.apk | head -3
      - name: Ghim phiên bản GeckoView (chỉ chạy khi chưa có gecko.version)
        if: github.ref == 'refs/heads/main' && hashFiles('gecko.version') == ''
        continue-on-error: true   # lỗi ở bước này không làm hỏng build
        run: |
          V=$(gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q 2>/dev/null | grep -o 'geckoview-omni:128\.+ -> [^ ]*' | head -1 | sed 's/.*-> //')
          echo "GeckoView đang dùng: '$V'" | tee -a "$GITHUB_STEP_SUMMARY"
          if echo "$V" | grep -Eq '^128\.[0-9A-Za-z.-]+$'; then
            echo "$V" > gecko.version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gecko.version
            git commit -m "Ghim phiên bản GeckoView $V (CI tự ghi)"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopMiniLauncher-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 2
